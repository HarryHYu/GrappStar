<title>GrappStar drum + frame + launch + reel + sensors assembly steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--gl:max(16px, env(safe-area-inset-left, 0px));--gr:max(16px, env(safe-area-inset-right, 0px));--bg:#eef1f4;--panel:#ffffffeb;--ink:#15181c;--mute:#5b6470;--line:#d5dae0;--acc:#c46d00;--chip:#f4f6f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16191d;--panel:#1e2228eb;--ink:#e9edf1;--mute:#9aa4ae;--line:#343b44;--acc:#ffb020;--chip:#262b32}}
:root[data-theme="dark"]{--bg:#16191d;--panel:#1e2228eb;--ink:#e9edf1;--mute:#9aa4ae;--line:#343b44;--acc:#ffb020;--chip:#262b32}
html,body{margin:0;height:100%;
  background:var(--bg);color:var(--ink);font:13px/1.45 Arial,Helvetica,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-sizing:border-box}
#card{left:var(--gl);top:12px;width:370px;max-width:calc(100vw - var(--gl) - var(--gr));max-height:calc(100vh - 150px);overflow:auto}
#card h1{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:normal}
#st{font-weight:bold;font-size:16px;color:var(--acc)}
#sd{margin:6px 0 8px}
#count{color:var(--mute);font-size:12px;margin-bottom:4px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--mute);font-weight:normal;border-bottom:1px solid var(--line);padding:2px 4px 2px 0}
td{border-bottom:1px solid var(--line);padding:3px 4px 3px 0;vertical-align:top}
td .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;border:1px solid #0003}
td .d{color:var(--mute);font-size:11px;font-weight:normal}
tr.new td:first-child{font-weight:bold}
#nav{left:var(--gl);right:var(--gr);bottom:max(12px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#steps{display:flex;flex-wrap:wrap;gap:4px}
button{font:12px Arial,Helvetica,sans-serif;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--chip);color:var(--ink);cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc);font-weight:bold}
button.done{color:var(--mute)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:5px;max-width:280px;display:none;font-size:12px;z-index:5}
@media (max-width:760px){
  #card{width:auto;right:var(--gr);max-height:42vh;padding:8px 10px}
  #card table{display:none}#card.more table{display:table}#count::after{content:" (tap for the parts)"}
  #steps{display:none}
}
</style>
<div id="view"></div>
<div class="panel" id="card">
  <h1 id="ttl"></h1>
  <div id="st"></div>
  <div id="sd"></div>
  <div id="count"></div>
  <table><thead><tr><th>part</th><th>qty</th><th>material</th></tr></thead><tbody id="bill"></tbody></table>
</div>
<div class="panel" id="nav">
  <div class="row"><button id="prev">previous</button><button id="next">next</button><button id="replay">replay</button><button id="recam">reset camera</button><button id="theme">theme</button>
    <label><input type="checkbox" id="ghost"> ghost earlier parts</label></div>
  <div id="steps"></div>
</div>
<div id="tip"></div>

 onto the idler shaft flat from the long end. Slide idler post 2 onto the short journal and idler post 1 onto the long journal (the thick middle of the shaft sits between the posts and locates it). Lower the posts with the idler onto the deck so the small pinion meshes the drum A segment teeth, and bolt them down (2 x M3 x 12 each). Turn drum A back to LAUNCH (mark L at the top): the flat-sided lock cam must sit in the drum lock ring and the idler can no longer turn by hand.","parts":["drum_idler_gear","drum_idler","drum_bracket_idler","drum_bracket_idler2"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":2,"warnings":[]},{"title":"Main shaft: index contact","text":"Press an M3 nut into the index block pocket, screw the index lever foot to the block (M3 x 12), thread an M3 x 6 into the lever boss, head toward the nut. Screw the block to the inner face of the strut of idler post 2 (2 x M3 x 12 from the far side of the post into the block), with the nub on the coupler cam. Set the gap so the screw head touches the nut near the top of a bump (about 1.5 mm on a low part). Battery unplugged: nut to GND, screw to SW_INDEX.","parts":["drum_index_block","drum_index_lever"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":3,"warnings":[]},{"title":"Drum: fork and dog contacts","text":"Press an M3 nut into the hex hole of the yoke tab. Thread an M3 x 8 into each dog post boss first, heads toward each other (M3 x 8: a longer screw reaches the REEL gear; no room for a driver later). Slide the fork sleeve onto the rail, yoke facing the main shaft, then the dog post (its bar reaching back over the yoke tab). Grease the rail. Tighten the dog post clamp screw (M3 x 8, tapped) onto the rail flat. Battery unplugged: nut wire to GND, REEL side screw to SW_DOG_R, LAUNCH side screw to SW_DOG_L.","parts":["drum_dog_post","drum_fork"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":4,"warnings":[]},{"title":"Drum: drum B, hand lever, bracket B","text":"Swing the fork up on the rail, slide drum B onto the axle (hex socket over the drum A spigot; it fits one way only, cut corner to filled corner), swing the fork down so its pin drops into the groove. Slide the hand lever onto the hex boss. Press bracket B onto the axle and rail ends and bolt it down (2 x M3 x 12). The drum turns by hand with about 0.6 mm end play.","parts":["drum_drum_b","drum_hand_lever","drum_bracket_b"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":5,"warnings":[]},{"title":"Drum: N20","text":"Press the pinion onto the N20 output shaft (flat to flat) leaving 1.5 mm of shaft below it (that end runs in the bracket A ear slot). Slide the N20 into the cradle from the open end, fit the end plate (2 x M3 x 8). Press an M3 nut into the pocket in the cradle bottom face. Screw the cradle to the bracket A ear: pivot screw M3 x 12 in the round hole, swing screw M3 x 12 at the inner end of the arc slot (full mesh; the slot only lets it swing out). From the back of the ear, turn the SW_N20 screw (M3 x 8) in until its tip just touches the cradle nut. Battery unplugged: nut to GND, screw to SW_N20.","parts":["drum_n20_pinion","drum_n20","drum_n20_cradle","drum_n20_strap"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":6,"warnings":[]},{"title":"Drum: code switches","text":"Press an M3 nut into each of the 3 front pockets of the switch block and bolt it to the deck (2 x M3 x 12). Screw each lever foot to the block (M3 x 12), nub on its band. Thread an M3 x 6 into each lever boss, head toward the nut, so the head touches the nut near the top of a bump (gap about 1.8 mm with the nub low). Battery unplugged: nuts to GND, screws to SW_DRUM_A (nearest the motor), SW_DRUM_B, SW_DRUM_C.","parts":["drum_switch_block","drum_sw_lever_0","drum_sw_lever_1","drum_sw_lever_2"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":7,"warnings":[]},{"title":"Main shaft: stack","text":"Slide the REEL gear onto the coupler journal (plain face first) and screw the retaining washer to the journal end (2 x M3 x 6): the gear must spin free. Slide the collar onto the main shaft from the spigot end. Lower the shaft so the collar groove drops between the fork pads and push the hex end into the coupler socket, dimple toward the coupler screw hole (turn the shaft so the hole faces you). Turn the M3 x 16 retaining screw into the coupler wall until its tip sits in the dimple.","parts":["drum_shaft","drum_collar","drum_gear_reel","drum_reel_washer"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":8,"warnings":[]},{"title":"Main shaft: LAUNCH dog ring and magnet cap","text":"Fit the LAUNCH dog ring on the launch sleeve flange (sleeve lugs in the ring slots, 3 x M3 x 10 from the sleeve side into the ring) before the launch sleeve goes on the spigot (launcher steps). After the launcher: glue the AS5600 magnet into the cap, push the cap on the spigot end (flat to flat) and fit the M3 x 6 onto the flat. Hand use of the drum: battery unplugged, slacken the line, loosen the swing screw, swing the N20 out, turn the lever, swing back and tighten.","parts":["drum_dogring_launch","drum_magnet_cap"],"handle":[],"subsystem":"drum","auto":false,"stage":null,"seq":9,"warnings":[]},{"title":"Launcher 1: print the parts","text":"All PLA unless named. PPA-CF: big gear, drive gear, launch sleeve, big gear pin, SW_SEATED plunger and pushrod, and the aim gears (sun, idler, output, bevel, worm, crank). Use each part's print orientation from the print sheet: the carriage body lies on its side across the bed diagonal; the stop springs print upside down at 100 percent infill (all perimeters); rail pieces lie on their largest flat face. 0.2 mm layers, 4 walls on every loaded part. Hardware: M3 screws (x6, x10, x12, x16, x20) and nuts, 2 x 8 mm steel rod pins (cut to the length on the print sheet) for the spring anchors, 3 x 693ZZ for the tether pulleys, sprag #1 (CSK20PP), the two springs.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":10,"warnings":[]},{"title":"Screw the reel wall to the deck","text":"Stand the reel wall on the deck at its marked place. Put eight M3 screws down through the counterbored foot holes into the deck inserts and tighten. Do this first: the storage reel and the gears later cover some of the holes.","parts":["reel_wall"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":11,"warnings":[]},{"title":"Sprag hub and sprag (CSK20PP)","text":"Push the sprag hub's round spigot into the big hole in the wall from the front, flange flat on the wall, and screw it on from the front with four M3 x 8 screws (they tap into the wall). Find the key slot on the outside of the CSK20PP and line it up with the printed rib at the top of the hub's seat. Check the arrow on the bearing: seen from the front, the inner ring must turn freely counter-clockwise and lock clockwise. Press it in flat until it sits on the lip.","parts":["reel_sprag_hub","reel_hub_screws","reel_sprag"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":12,"warnings":[]},{"title":"Capstan tube","text":"Slide the capstan tube in from the FRONT, D-flat end first, its key rib lined up with the key slot inside the sprag. Push until the collar sits on the sprag. It turns one way only (counter-clockwise seen from the front).","parts":["reel_c"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":13,"warnings":[]},{"title":"Bus gear, swing arm and swing idler","text":"From behind the wall slide the 46-tooth bus gear onto the tube, gear face first, hub toward you. Slip the swing arm's ring over the bus gear's hub, idler pin pointing at the wall, and put the 30-tooth swing idler on the pin. The idler is held between the arm and the wall. The arm swings 12 degrees between its two stop pins.","parts":["reel_bus","reel_swing_arm","reel_gi"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":14,"warnings":[]},{"title":"Capstan gear","text":"Slide the 22-tooth capstan gear onto the D-flat behind the bus gear, hub toward the bus gear, and snap the large C-clip into the groove behind it. The bus gear must still turn freely.","parts":["reel_gc","reel_c_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":15,"warnings":[]},{"title":"Capstan drum","text":"Slide the green drum onto the front of the tube, flange first, key slot on the rib, until it sits on the collar.","parts":["reel_drum"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":16,"warnings":[]},{"title":"Cup shaft and wrap cup","text":"Push the cup shaft through the tube from the FRONT, plain end first (the neck end stays in front), until its back end comes out behind the capstan gear. Slide the wrap cup onto the front end (flat in the bore onto the flat of the shaft, ring at the top), over the drum. Push Harry's small C-clip sideways onto the neck in front of the cup.","parts":["reel_k","reel_cup","reel_cup_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":17,"warnings":[]},{"title":"Cup gear","text":"From behind, slide the 24-tooth cup gear onto the D-flat at the back of the cup shaft, hub forward, and snap its C-clip on. The cup must turn freely both ways.","parts":["reel_gk","reel_k_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":18,"warnings":[]},{"title":"Wiper motor on its adapter (bench)","text":"Battery unplugged. Put the M6 bolts through the adapter slots from the cheek side (heads sit in the slot counterbores), into the motor bosses (threaded bosses, or a nut behind each boss ear). Slide the motor so its shaft is centred in the hub hole (a 10 mm drill shank in the coupler bore helps), then tighten.","parts":["frame_motor_adapter","frame_wiper_motor","frame_wiper_shaft"],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":19,"warnings":["moved ahead of 'Heat-set inserts', 'Drill the rover', 'Deck on the rover', 'Motor-side cheek' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Heat-set inserts","text":"Soldering iron at about 220 C (PLA) with an insert tip. Press every M3 x 4 x 5 insert square into its 4.0 mm hole until flush: deck (46), cheeks (block rings, ties, motor ring, sensor bracket), bay corners, standoffs and clamp posts, cheek ties (both ends). Let each cool before the next one nearby.","parts":["frame_deck_1","frame_deck_2","frame_deck_3","frame_deck_4","frame_cheek_r","frame_ebay"],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":20,"warnings":[]},{"title":"Drill the rover","text":"Lay the deck on the rover top plate where it will live (launch direction forward). Mark through the 50 perimeter holes with a 3 mm drill or a scriber (or tape down the 1:1 PDF template from cad/parts/_frame_tests/drill_template.py), take the deck off, drill 3.4 mm. Deburr. If the deck is in tiles, slide the dovetails together first and mark them as one.","parts":[],"handle":["frame_deck_1","frame_deck_2","frame_deck_3","frame_deck_4"],"subsystem":"frame","auto":false,"stage":null,"seq":21,"warnings":[]},{"title":"Deck on the rover","text":"Slide the tiles together on the dovetails (from above). M3 x 25 SHCS down through every perimeter hole, washer and nyloc under the rover plate. Snug, not crushed.","parts":[],"handle":["frame_deck_1","frame_deck_2","frame_deck_3","frame_deck_4"],"subsystem":"frame","auto":false,"stage":null,"seq":22,"warnings":[]},{"title":"Motor-side cheek","text":"Stand the motor-side cheek on the deck, foot outboard. M3 x 10 SHCS through the foot into the deck inserts. The 44 mm hole with the 6-insert ring is the wiper axis.","parts":[],"handle":["frame_cheek_r"],"subsystem":"frame","auto":false,"stage":null,"seq":23,"warnings":[]},{"title":"Motor onto the cheek","text":"Before any shaft goes in: offer the motor and adapter to the motor-side cheek, spigot into the plate counterbore (stand the motor leg on the deck first: 2 x M3 x 10 down into the deck, 2 x M3 x 16 along y through the leg into the plate bridge). From the frame side of the plate, M3 x 10 through the plate into every insert in the adapter hub (10 of the 12 holes line up with inserts; the others stay empty).","parts":["frame_motor_leg"],"handle":["frame_motor_adapter"],"subsystem":"frame","auto":false,"stage":null,"seq":24,"warnings":[]},{"title":"Shafts and trains (other subsystems)","text":"Now the drum, launch and reel subsystems put their shaft assemblies in (bearings already pressed on the shafts), each bearing into its block pocket on this cheek. Follow their steps, then come back.","parts":[],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":25,"warnings":[]},{"title":"Electronics bay","text":"Battery unplugged. Bay on the deck, 4 x M3 x 10 through the tabs. Boards in: BTS7960 on its 4 standoffs (M3 x 6), heatsink down; ESP32 DevKitC pins down into the cradle, USB end into the wall slot, clamp with 2 x M3 x 8; DRV8833, MP1584 and HX711 into their pockets with a cable tie through the floor slots or a drop of hot glue. Fuse holder in its cradle with a cable tie.","parts":["frame_ebay_lid","frame_ebay_esp_clamp","frame_pcb_esp32","frame_pcb_bts7960","frame_pcb_mp1584","frame_pcb_drv8833","frame_pcb_hx711","frame_fuse_20a"],"handle":["frame_ebay"],"subsystem":"frame","auto":false,"stage":null,"seq":26,"warnings":[]},{"title":"Set the buck BEFORE wiring the DRV8833","text":"Battery unplugged. Wire only the buck input to the fuse output and ground. Plug the battery in, meter on the buck output, turn the trimpot until it reads 9.0 V. Unplug the battery. Only then wire buck output to DRV8833 VIN (the DRV8833 dies above 10.8 V).","parts":[],"handle":["frame_pcb_mp1584","frame_pcb_drv8833"],"subsystem":"frame","auto":false,"stage":null,"seq":27,"warnings":[]},{"title":"Gear guards","text":"Last, after every train has been turned by hand: the hood goes over the gears behind the motor plate, 3 x M3 x 12 through its lugs into the plate inserts; the front guard stands on the deck between the drum gears and the bay, M3 x 10 into the deck inserts. Turn the wiper by hand once: nothing rubs.","parts":["frame_guard_hood","frame_guard_front"],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":28,"warnings":[]},{"title":"Camera, receiver and cable anchors","text":"Camera column on the deck, 4 x M3 x 10 into the inserts. Clip the Kiyo X onto the 16 mm edge plate like onto a monitor (or use a 1/4-20 tripod screw up through the plate hole); it looks forward along the launch line. RC832: stand it antenna-end up in its holder slot, leads out of the low notch, holder 2 x M3 x 10. Cable anchors 1 x M3 x 12 each; tie the camera USB, the receiver AV lead and the capture dongle lead to them so no plug carries the cable weight.","parts":["frame_camera_mount","frame_rc832_holder","frame_rc832","frame_kiyo_x","frame_cable_anchor_1","frame_cable_anchor_2"],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":29,"warnings":[]},{"title":"Wiring and lid","text":"Battery unplugged. Follow firmware/base/WIRING.md. Every wire leaving the bay goes through its wall exit and is cable-tied to the anchor beside it (strain relief). 14 AWG for battery, fuse, BTS7960 and motor. Lid on, 4 x M3 x 6. USB cable from the ESP32 native USB port to the Jetson.","parts":[],"handle":["frame_ebay_lid"],"subsystem":"frame","auto":false,"stage":null,"seq":30,"warnings":[]},{"title":"Fit the remaining frame parts","text":"Parts without an explicit assembly step: frame_can_stay, frame_perfboard.","parts":["frame_can_stay","frame_perfboard"],"handle":[],"subsystem":"frame","auto":true,"stage":null,"seq":31,"warnings":[]},{"title":"Launcher 9: time the big gear (fingers clear)","text":"No springs fitted yet. Hold the carriage on its stop by hand and turn the drive gear FORWARD until the first tooth after the toothless gap just touches the rearmost rack tooth: this is HOME and SW_GAP closes. Turning on pulls the carriage back smoothly; at full cock the cut last tooth lets go (push the carriage home by hand). Hold the drive gear from the side and never put a hand in front of the carriage.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":32,"warnings":["moved ahead of 'Launcher 2: join the rail', 'Launcher 2b: splice straps and spring guards', 'Launcher 3: big gear', 'Launcher 4: drive gear, sprag #1 and the launch sleeve', 'Launcher 5: carriage', 'Launcher 5b: lip roller', 'Launcher 6: carriage stops', 'Launcher 8: contacts' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Aim 1: aim housing, worm, wheel, crank","text":"Build the aim housing on the bench (it goes onto the base later, after the rail). Mount the AS5600 board on the housing's outer bracket, chip facing inwards. Build SW_RAIL_LOW like SW_GAP and screw it to the housing where the crank cam presses it. Fit the two 608 bearings into the crank (worm wheel) hub and slide it onto the M8 bolt through the housing outer wall; fit the nut. Lay the worm shaft with the small bevel in its saddles and screw the cap on. Fit the countershaft with the output gear and the big bevel.","parts":["launch_aim_housing","launch_aim_cap","launch_aim_worm","launch_aim_crank","launch_aim_bolt","launch_aim_brg_1","launch_aim_brg_2","launch_aim_output","launch_aim_bevel30"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":33,"warnings":["moved ahead of 'Launcher 2: join the rail', 'Launcher 2b: splice straps and spring guards', 'Launcher 3: big gear', 'Launcher 4: drive gear, sprag #1 and the launch sleeve', 'Launcher 5: carriage', 'Launcher 5b: lip roller', 'Launcher 6: carriage stops', 'Launcher 8: contacts', 'Launcher 10: tether pulleys' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Aim 2: splitter","text":"Slide the sun onto the sleeve's outer rib. Push the printed drag pad into the swing arm hub pocket with the shim behind its root block (a thicker shim gives more drag), slide the arm on next to the sun, fit the idler on the arm pin and snap the printed C clip into the pin groove. Turn the sleeve backward by hand: the arm swings the idler into the output gear and drives it; forward, the arm swings out onto its stop and the output gear stays still.","parts":["launch_aim_sun","launch_aim_arm","launch_aim_idler","launch_aim_drag_pad","launch_aim_drag_shim","launch_aim_idler_clip"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":34,"warnings":["moved ahead of 'Launcher 2: join the rail', 'Launcher 2b: splice straps and spring guards', 'Launcher 3: big gear', 'Launcher 4: drive gear, sprag #1 and the launch sleeve', 'Launcher 5: carriage', 'Launcher 5b: lip roller', 'Launcher 6: carriage stops', 'Launcher 8: contacts', 'Launcher 10: tether pulleys' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Aim 3: lug, conrod, rail onto the base","text":"Bolt the lug to the left rail wall (2 x M3 self tap). With the sun and swing arm already on the sleeve, slide the rail assembly's sleeve along the main axis onto the drum's d12 spigot from the outboard side (the LAUNCH dog ring is already bolted to its flange, Launcher 4) until the ring's dogs sit by the drum collar. Then slide the aim housing on from the outboard side so the sleeve end enters its bushing, and screw the housing to the deck (4 x M3). Join the conrod to the crank pin and the lug pin and snap a printed C clip into each pin groove. Turn the wiper backward slowly: the rail rises to 47 deg, then lowers to 6 deg.","parts":["launch_aim_lug","launch_aim_conrod","launch_aim_crankpin_clip","launch_aim_lugpin_clip"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":35,"warnings":["moved ahead of 'Launcher 2: join the rail', 'Launcher 2b: splice straps and spring guards', 'Launcher 3: big gear', 'Launcher 4: drive gear, sprag #1 and the launch sleeve', 'Launcher 5: carriage', 'Launcher 5b: lip roller', 'Launcher 6: carriage stops', 'Launcher 8: contacts', 'Launcher 10: tether pulleys' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Launcher 2: join the rail","text":"Lay the rear, mid and front rail pieces in a line on a flat table. Push each joint together and fit 2 x M3 x 20 with nuts through each flange pair (8 in total). Tighten evenly; file any step inside the track where the pieces meet so the carriage shoes slide over it.","parts":["launch_rail_rear","launch_rail_mid","launch_rail_front"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":36,"warnings":[]},{"title":"Spring guards","text":"After the springs are hooked on: lay each guard over its spring, flange against the rail wall, M3 x 10 through each lug into the rail wall insert. Cock by hand once with the wiper unplugged: the carriage arms must pass under the guard tops without touching.","parts":["frame_spring_guard_l_1","frame_spring_guard_r_1","frame_spring_guard_l_2","frame_spring_guard_r_2","frame_spring_guard_l_3","frame_spring_guard_r_3"],"handle":[],"subsystem":"frame","auto":false,"stage":null,"seq":37,"warnings":[]},{"title":"Launcher 2b: splice straps and spring guards","text":"Screw a splice strap on each wall top across the front joint (4 x M3 x 10 self tap each). Screw the spring guard plates to the rail walls and anchor posts (M3 self tap into the pilots, see the print sheet), three per side: rear, middle (under the stop units), front. Fit them before the springs.","parts":["launch_rail_splice_l","launch_rail_splice_r","launch_guard_l_a","launch_guard_l_b","launch_guard_l_c","launch_guard_r_a","launch_guard_r_b","launch_guard_r_c"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":38,"warnings":[]},{"title":"Launcher 3: big gear","text":"Hold the big gear between the two cheeks of the mid piece, the toothed sector towards the drum side (right) and the full ring of teeth towards the left, with the spacer washer between the gear and the left cheek. Push the big gear pin through cheek, gear, washer, cheek from the right and snap the C clip into its groove. The gear must spin freely with almost no end play.","parts":["launch_big_gear","launch_gear_pin","launch_gear_clip","launch_gear_washer"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":39,"warnings":[]},{"title":"Launcher 4: drive gear, sprag #1 and the launch sleeve","text":"First bolt cad-drum's LAUNCH dog ring to the sleeve flange: lugs in the ring slots, 3 x M3 x 10 from the flange side into the tapped ring (the heads are out of reach once the sleeve is in the cheeks). Slide sprag #1 into the drive gear so its outer keyway takes the rib inside the gear. Check the direction: holding the gear, the inner race must turn freely only the BACKWARD wiper way. Hold the drive gear between the cheeks (collar side right, then the spacer washer on its left), meshing the big gear's full ring of teeth. Turn the cheek bores so their slots point down, then push the launch sleeve in from the motor side, outboard end first, ribs lined up with the slots and the sprag keyway, until the long (15 mm) rib sits inside the sprag.","parts":["launch_drive_gear","launch_sprag","launch_sleeve","launch_drive_washer"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":40,"warnings":[]},{"title":"Launcher 5: carriage","text":"Turn the big gear so its toothless gap faces the rack. Slide the carriage BODY into the track from the FRONT end (the tether fork blocks the rear), rack teeth down, until its rear face reaches the stop position. Yoke: push the SW_SEATED pushrod into the block bore from the rear, collar first, then push the plunger's pin up through the block from below (pad under the left arm) and press the head cap on the pin top. Lower the yoke onto the carriage rear so its key plates drop into the slots in the body webs, and fit 1 x M3 x 16 per side through the yoke into the webs.","parts":["launch_carriage","launch_carriage_yoke","launch_seat_plunger","launch_seat_pushrod","launch_seat_clip"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":41,"warnings":[]},{"title":"Launcher 5b: lip roller","text":"Press a 693ZZ into the lip roller and fit it in the fork at the carriage front with the M3 x 20 and a nyloc nut through the side counterbores; it must spin freely. The tether runs over it in tow and retrieval, and the dart's tail slides in over it through the funnel onto the cradle.","parts":["launch_muzzle_roller","launch_muzzle_roller_brg","launch_muzzle_roller_axle"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":42,"warnings":[]},{"title":"Launcher 6: carriage stops","text":"For each side: put the stop spring on its ledges over the main spring position, rear bar towards the carriage arm. Fit the stop frame over it: 2 x M3 x 12 through the rear foot into the rail wall and 2 x M3 x 16 through the front foot into the rail front plate. Then pull the spring onto the frame's front wall with the 2 x M3 x 20 draw screws, a turn each in turn, until it sits on the wall (4.4 mm of preload). The rear bar must rest on both ledges.","parts":["launch_stop_spring_l","launch_stop_spring_r","launch_stop_frame_l","launch_stop_frame_r"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":43,"warnings":[]},{"title":"Launcher 8: contacts","text":"SW_HOME (right lip) and SW_SEATED (left lip): drop an M3 nut into the slot in the rail wall with a stripped wire end under it. Screw an M3 x 6 up through the lever's leaf, head down, then screw the lever root to the lip with one M3 x 10 (self tap). With the carriage on its stop, the right foot presses SW_HOME closed; set the screw so the head just touches the nut, then back it off a quarter turn and check it closes with the carriage home and opens 10 mm back. SW_SEATED closes only with a dart on the sled (no springs yet: hold the carriage on its stop by hand to check). SW_GAP, SW_RAIL_LOW and the AS5600 carrier are fitted in the Sensors steps (cad-sensors).","parts":["launch_sw_home","launch_sw_home_screw","launch_sw_home_nut","launch_sw_seated","launch_sw_seated_screw","launch_sw_seated_nut"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":44,"warnings":[]},{"title":"Launcher 10: tether pulleys","text":"Press a 693ZZ into each printed pulley. Fit the top and bottom pulleys in the fork behind the rail (M3 x 16 axle, nut) and the pivot pulley on the right cheek lug under the axis (M3 x 16 from inside). Thread the line from the reel side under the pivot pulley, back under the rail to the bottom pulley, up over the top pulley and forward through the pusher hole to the dart's tail cap. Never fire without the tether.","parts":["launch_pulley_top","launch_pulley_top_brg","launch_pulley_top_axle","launch_pulley_bot","launch_pulley_bot_brg","launch_pulley_bot_axle","launch_pulley_piv","launch_pulley_piv_brg","launch_pulley_piv_axle","launch_line_b","launch_line_c","launch_line_p","launch_line_a0","launch_line_a1","launch_line_a2","launch_line_a3","launch_line_a4","launch_line_a5","launch_line_a6","launch_line_a7","launch_line_a8"],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":45,"warnings":[]},{"title":"Launcher 11: wiring (battery unplugged)","text":"Battery unplugged. Run the SW_HOME, SW_SEATED and SW_GAP wires along the rail to the pivot and leave a 150 mm loop at the main axis before they go to the frame. No wire goes onto the carriage. Each contact: one wire to its ESP32 pin (SW_HOME 21, SW_GAP 39, SW_RAIL_LOW 40, SW_SEATED 41, as params.SWITCHES), the other to GND.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":null,"seq":46,"warnings":[]},{"title":"Test stage 5 only: springs (NOT during assembly)","text":"The springs go on at test stage 5, after the big gear timing, the contacts and the aim train have been checked without them. Spring guards on first (never cock with a guard off) and never fire without the tether attached (D11). Hook the back end of each spring over the inner peg of the yoke arm. Put the front hook between post and strap, lined up with the main hole, and push the 8 mm steel rod pin down through strap, hook and post. Hole set F, 8.5 mm rearward, is the fallback if the hang test shows the spring needs less stretch. The outer holes are spare. The springs are slightly stretched and hold the carriage against the stop. A drop of glue on the pin top stops it working up.","parts":["launch_anchor_pin_l","launch_anchor_pin_r","launch_spring_l_hook_a","launch_spring_r_hook_a","launch_spring_l_hook_c","launch_spring_r_hook_c","launch_spring_l_0","launch_spring_l_1","launch_spring_l_2","launch_spring_l_3","launch_spring_l_4","launch_spring_r_0","launch_spring_r_1","launch_spring_r_2","launch_spring_r_3","launch_spring_r_4"],"handle":[],"subsystem":"launch","auto":false,"stage":99,"seq":47,"warnings":[]},{"title":"Fit the remaining launch parts","text":"Parts without an explicit assembly step: launch_dart.","parts":["launch_dart"],"handle":[],"subsystem":"launch","auto":true,"stage":null,"seq":48,"warnings":[]},{"title":"Sensors 1: build the two contact switches (SW_RAIL_LOW, SW_GAP)","text":"For each switch: press an M3 nut into the hex trap on the base pillar (a drop of glue), solder a wire to the nut through the side slot and lay it in the groove. Screw the lever onto the pad with 2 x M3x10 self tapping screws. Screw an M3x10 through the lever boss from the top, head down, with a ring lug and the second wire under a jam nut on top. Turn the screw until the head touches the nut, then back it off 1.9 turns (gap about 0.9 mm, 0.5 mm per turn) and lock the jam nut.","parts":["sensors_sw_rail_low","sensors_sw_rail_low_lever","sensors_sw_rail_low_screw","sensors_sw_rail_low_jam","sensors_sw_rail_low_nut","sensors_sw_gap","sensors_sw_gap_lever","sensors_sw_gap_screw","sensors_sw_gap_jam","sensors_sw_gap_nut"],"handle":[],"subsystem":"sensors","auto":false,"stage":null,"seq":49,"warnings":[]},{"title":"Sensors 2: SW_RAIL_LOW on the aim housing","text":"Screw the switch base to its bracket (4 x M3x8 self tapping), lever pointing to the crank. Set the bracket foot on the housing foot extension in front of the crank and screw it down with 2 x M3x10. The housing's front deck screw goes up through the foot extension into the bracket foot. Turn the crank by hand (wiper backwards) to the lowest rail position: the cam lobe must press the lever tip and the meter must show the switch closed; 10 deg either side it must open.","parts":["sensors_sw_rail_low_bracket"],"handle":[],"subsystem":"sensors","auto":false,"stage":null,"seq":50,"warnings":[]},{"title":"Sensors 3: SW_GAP on the right rail cheek","text":"The SW_GAP base has its own arm. Hold the arm tab on the outer face of the right rail cheek, below the big gear, and screw it on with 2 x M3x12 (heads in the counterbores). With the big gear at rest (toothless gap at the rack) the cam bump presses the lever: switch closed. Turn the gear 20 deg either way: switch open.","parts":[],"handle":[],"subsystem":"sensors","auto":false,"stage":null,"seq":51,"warnings":[]},{"title":"Sensors 4: AS5600 board","text":"Battery unplugged. Plug the STEMMA QT cable into the board's connector on the +x end (the end away from the housing spine). Push the board onto the 4 pegs of the carrier, chip facing out. Drop an M3 nut into the hex pocket of each clamp strip, lay the strips over the board edges (pegs through their holes) and screw each from the carrier back with an M3x10. Screw the carrier column to the aim housing spine with 2 x M3x16. Check by eye: the chip sits on the shaft axis, about 2.0 mm from the magnet face, and the cap turns free.","parts":["sensors_as5600","sensors_as5600_carrier","sensors_as5600_strip_top","sensors_as5600_strip_bot","sensors_as5600_nut_top","sensors_as5600_nut_bot","sensors_as5600_screw_top","sensors_as5600_screw_bot","sensors_as5600_col_screws"],"handle":[],"subsystem":"sensors","auto":false,"stage":null,"seq":52,"warnings":[]},{"title":"Brake crank, rocker and bar","text":"Grease the crank boss low on the left of the wall front. Slide the black bell crank onto it, the long arm into the recess pointing right, the short arm up. Put the printed washer on the boss and screw the M3 x 10 into the boss top: the crank must swing freely. Hang the yellow rocker between the two ears at the top with an M3 x 25 screw and nut (snug, it must swing); its round hole sits over the small boss and its leg hangs in front of the crank's long arm. Screw two M3 x 8 screws into the rocker's two bosses from behind, until their tips stand 0.5 mm proud of the front. Lay the brake bar in the two U guides, left end against the crank's short arm, nose toward the drum. Close each guide with its cap and two M3 x 16 screws. Push the nose: the crank swings and the rocker leg moves forward; let go and it all springs back.","parts":["reel_crank","reel_crank_washer","reel_crank_screw","reel_rocker","reel_rocker_pin","reel_trim_screws","reel_bar","reel_bar_cap_1","reel_bar_cap_2","reel_bar_screws"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":53,"warnings":["moved ahead of 'Storage reel' of its subsystem: their parts do not sit on anything placed yet (reorder the subsystem's steps or give them a stage)"]},{"title":"Storage reel","text":"Press one 608 bearing into each end of the reel body. Push the Dyneema end through the small hole in the core near the back flange into the open pocket, tie a stopper knot (figure eight) and pull it tight. Lay the flat flange disc on the front, its slots on the three lugs, raised ring outward. Slide the reel onto the reel shaft from the shaft's thin end until the disc meets the shaft's round head. Slide the thrust ring onto the shaft behind the reel, small boss toward the bearing.","parts":["reel_spool","reel_spool_flange","reel_brg_1","reel_brg_2","reel_s","reel_t"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":54,"warnings":[]},{"title":"Reel shaft into the wall","text":"Feed the reel shaft's thin end through the rocker's hole and the wall bushing from the front. From behind, slide the 20-tooth reel gear onto the D-flat, hub toward the wall, and snap its C-clip on. Swing the arm toward the reel gear (to its stop): the idler meshes it. Spin the reel by hand: it should turn with a light, even drag.","parts":["reel_gr","reel_s_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":55,"warnings":[]},{"title":"SW_ARM contact","text":"Battery unplugged. Build the printed contact (see the contact switch page): nut pressed in the base trap, lever screwed on, M3 x 10 contact screw with its jam nut in the lever. Screw the switch base to the bracket, and the bracket to the back of the wall below the gears with two M3 x 10. Turn the cup to home (ring at the top): the bump on the cup gear presses the lever; set the contact screw so it just closes there and opens 15 degrees either side. Lock the jam nut.","parts":["reel_sw_bracket","reel_sw_base","reel_sw_lever","reel_sw_hw"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":56,"warnings":[]},{"title":"Pulley 2","text":"Screw the pulley 2 post to the deck beside the drum with four M3 screws. Press a 693ZZ into pulley 2, set it between the post's cheeks and push the M3 x 16 axle down through (nyloc nut under). The line from pulley 1 runs along the base to it and leaves toward the rail pivot pulley.","parts":["reel_p2_post","reel_pulley2","reel_p2_brg","reel_p2_axle"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":57,"warnings":[]},{"title":"Shroud","text":"Put the shroud round the reel, its flange on the wall, opening at the top right, and screw it on with three M3 x 8 screws into the wall. The reel must not touch it anywhere.","parts":["reel_shroud"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":58,"warnings":[]},{"title":"Exit eye post and line","text":"Stand the exit eye post on the pad at the front of the wall foot and screw it down with two M3 screws into the deck. Wind the line onto the reel (counter-clockwise seen from the front, line over the top), thread it through the guide eye, over the top of the cup, through the cup ring from the back, then through the exit eye. Press the 693ZZ into pulley 1, set the pulley between the fork cheeks with the line in its groove and push the M3 x 16 axle down through (nyloc nut under). Lead the line on toward the rail pivot pulley.","parts":["reel_exit_post","reel_pulley1","reel_p1_brg","reel_p1_axle"],"handle":[],"subsystem":"reel","auto":false,"stage":null,"seq":59,"warnings":[]}],"ext_files":["web/assembly_ext_0.json"]};

<script>
// base/tools/web/viewer_core.js: generic three.js scene builder for the CAD pipeline.
// Input: window.CAD_DATA (built by tools/render.py build_data):
//   parts:  [{name, color, material, notes, subsystem, joint, bought_ref, printed, qty, mass_g, group, place[16]}]
//   meshes: {name: {q: [ox, oy, oz, s], v: b64 int16 xyz, f: b64 uint16 or uint32, h: hull vertex indices, wide: bool}}
//   tracks: {n, t[], joints: [{name, parent, kind, origin[3], axis[3], base[16] | null, v: b64 values * n | c}],
//            line: {cnt: b64 uint16 * n, p: b64 float32 xyz} (tether polyline per sample, optional)}
//   box_track: world bbox over all samples
// Group 0 is the world; group k is joint k - 1: world = parent * T(origin) * base * motion(value), the value
// (rev: degrees, slide: mm) interpolated linearly between samples. Part world matrix = group * place (row-major).
// CADV.build(container, data, opts) returns a viewer with sample(), cut(), explode(), cam(), highlight(), shot API.
(function () {
  'use strict';
  const V3 = THREE.Vector3, M4 = THREE.Matrix4, Q = THREE.Quaternion;
  const D2R = Math.PI / 180;

  function b64(s, T) {
    const bin = atob(s), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new T(u.buffer);
  }
  function rowMajor(a) { const m = new M4(); m.set(...a); return m; }

  // Indexed mesh -> non-indexed geometry with creased normals (smooth below the crease angle, sharp above).
  function creased(pos, idx, creaseDeg) {
    const nf = idx.length / 3, nv = pos.length / 3, cosT = Math.cos((creaseDeg || 32) * D2R);
    const fn = new Float32Array(nf * 3), fa = new Float32Array(nf);
    for (let f = 0; f < nf; f++) {
      const a = idx[3 * f] * 3, b = idx[3 * f + 1] * 3, c = idx[3 * f + 2] * 3;
      const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
      const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1; fa[f] = l;
      fn[3 * f] = nx / l; fn[3 * f + 1] = ny / l; fn[3 * f + 2] = nz / l;
    }
    const cnt = new Uint32Array(nv + 1);
    for (let i = 0; i < idx.length; i++) cnt[idx[i] + 1]++;
    for (let i = 0; i < nv; i++) cnt[i + 1] += cnt[i];
    const adj = new Uint32Array(idx.length), fill = cnt.slice(0, nv);
    for (let i = 0; i < idx.length; i++) adj[fill[idx[i]]++] = (i / 3) | 0;
    const P = new Float32Array(nf * 9), N = new Float32Array(nf * 9);
    for (let f = 0; f < nf; f++) {
      const fx = fn[3 * f], fy = fn[3 * f + 1], fz = fn[3 * f + 2];
      for (let k = 0; k < 3; k++) {
        const v = idx[3 * f + k], o = 9 * f + 3 * k;
        P[o] = pos[3 * v]; P[o + 1] = pos[3 * v + 1]; P[o + 2] = pos[3 * v + 2];
        let sx = 0, sy = 0, sz = 0;
        for (let j = cnt[v]; j < cnt[v + 1]; j++) {
          const g = adj[j], gx = fn[3 * g], gy = fn[3 * g + 1], gz = fn[3 * g + 2];
          if (gx * fx + gy * fy + gz * fz >= cosT) { const w = fa[g]; sx += gx * w; sy += gy * w; sz += gz * w; }
        }
        const l = Math.hypot(sx, sy, sz) || 1;
        N[o] = sx / l; N[o + 1] = sy / l; N[o + 2] = sz / l;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    return g;
  }

  function decodeMesh(md) {
    const q = b64(md.v, Int16Array), s = md.q[3], pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i += 3) { pos[i] = md.q[0] + q[i] * s; pos[i + 1] = md.q[1] + q[i + 1] * s; pos[i + 2] = md.q[2] + q[i + 2] * s; }
    const IT = md.wide ? Uint32Array : Uint16Array, idx = b64(md.f, IT);
    let hull = pos;
    if (typeof md.h === 'string') {
      const h = b64(md.h, IT); hull = new Float32Array(3 * h.length);
      for (let i = 0; i < h.length; i++) { hull[3 * i] = pos[3 * h[i]]; hull[3 * i + 1] = pos[3 * h[i] + 1]; hull[3 * i + 2] = pos[3 * h[i] + 2]; }
    }
    return { geo: creased(pos, idx, 32), hull };
  }

  // Joint-space tracks: joints [{parent, kind, origin, axis, base, v (b64 float32/64 per sample) | c (constant)}],
  // parents before children. group 0 = world, group k = joint k - 1.
  function decodeTracks(T) {
    return (T.joints || []).map(j => {
      const pre = new M4().makeTranslation(j.origin[0], j.origin[1], j.origin[2]);
      if (j.base) pre.multiply(rowMajor(j.base));
      const vals = typeof j.v === 'string' ? b64(j.v, j.f64 ? Float64Array : Float32Array) : null;
      return { name: j.name, parent: j.parent, kind: j.kind, axis: new V3(j.axis[0], j.axis[1], j.axis[2]), pre, vals, c: +j.c || 0, world: new M4() };
    });
  }
  function jointValue(J, s) {
    const a = J.vals; if (!a) return J.c;
    const n = a.length; if (n === 1) return a[0];
    s = Math.max(0, Math.min(n - 1, s));
    const i = Math.min(n - 2, Math.floor(s)), f = s - i;
    return a[i] + (a[i + 1] - a[i]) * f;
  }
  // Tether polyline per sample: {cnt: b64 uint16 per sample, p: b64 float32 xyz of all points in sample order}
  function decodeLine(L) {
    if (!L || typeof L.p !== 'string') return null;
    const cnt = b64(L.cnt, Uint16Array), p = b64(L.p, Float32Array), off = new Uint32Array(cnt.length + 1);
    for (let i = 0; i < cnt.length; i++) off[i + 1] = off[i] + cnt[i];
    let mx = 0; for (let i = 0; i < cnt.length; i++) mx = Math.max(mx, cnt[i]);
    return { cnt, p, off, max: mx };
  }

  // cut faces: back faces drawn flat with a screen-space hatch, so a sectioned solid reads as filled
  function capMaterial(color, planes) {
    const c = new THREE.Color(color).convertSRGBToLinear();
    const hsl = c.getHSL({}); if (hsl.l < 0.22) c.setHSL(hsl.h, hsl.s, 0.22);     // dark parts: keep the hatch readable
    const m = new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide, clippingPlanes: planes,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -4 });
    m.onBeforeCompile = sh => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>',
        '#include <dithering_fragment>\n float hz = mod(gl_FragCoord.x + gl_FragCoord.y, 9.0);\n' +
        ' gl_FragColor.rgb = mix(gl_FragColor.rgb * 0.62, vec3(0.08), hz < 1.6 ? 0.55 : 0.0);');
    };
    return m;
  }

  // theme colours for the scene (the page background comes from the CSS tokens)
  function sceneTheme(dark) {
    return dark ? { hemiGround: 0x30343a, hemi: 0.55, grid1: 0x3a4048, grid2: 0x2a2f36, gridOp: 0.45, shadow: 0.45, key: 0.8 }
      : { hemiGround: 0x8a94a0, hemi: 0.7, grid1: 0xc3c8cf, grid2: 0xdde1e6, gridOp: 0.8, shadow: 0.22, key: 0.85 };
  }

  function build(container, data, opts) {
    opts = opts || {};
    const hd = !!opts.hd, shot = !!window.CAD_SHOT;       // CAD_SHOT: headless capture (shots.js), cheaper settings
    const dpr = window.devicePixelRatio || 1;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(shot ? Math.min(2, dpr) : Math.min(2, dpr) * (hd && dpr < 2 ? 1.5 : 1));   // shots: no hd boost (ratio 1 unless the job sets a device scale)
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = opts.shadows !== false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const bg = new THREE.Color(opts.bg || '#eef1f4'); scene.background = bg;
    let dark = opts.dark != null ? !!opts.dark : bg.getHSL({}).l < 0.5;
    let TH = sceneTheme(dark);
    const cam = new THREE.PerspectiveCamera(30, container.clientWidth / Math.max(1, container.clientHeight), 0.5, 1e6);
    cam.up.set(0, 0, 1);
    const ctl = THREE.OrbitControls ? new THREE.OrbitControls(cam, renderer.domElement) : null;
    if (ctl) { ctl.enableDamping = false; ctl.screenSpacePanning = true; }

    // lights
    const hemi = new THREE.HemisphereLight(0xffffff, TH.hemiGround, TH.hemi); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, TH.key); key.castShadow = true;
    const sm = shot ? 1024 : hd ? 4096 : 2048;
    key.shadow.mapSize.set(sm, sm); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
    scene.add(key); scene.add(key.target);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.2); scene.add(rim);

    // clipping plane: keeps coord <= value along the chosen axis
    const clip = new THREE.Plane(new V3(-1, 0, 0), 1e9), planes = [clip];

    // parts
    const joints = decodeTracks(data.tracks), nS = data.tracks.n;
    const I4 = new M4();
    const groupWorld = g => (g > 0 && joints[g - 1]) ? joints[g - 1].world : I4;
    const parts = {}, list = [];
    for (const p of data.parts) {
      const md = data.meshes[p.name]; if (!md) continue;
      const dm = decodeMesh(md), geo = dm.geo;
      const metal = p.material === 'steel' || (p.material === 'bought' && /brg|bearing|608|steel|shaft|screw|bolt|nut|pin/i.test(p.name + ' ' + (p.bought_ref || '')));
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(p.color || '#c8ccd2').convertSRGBToLinear(), roughness: metal ? 0.38 : 0.6,
        metalness: metal ? 0.55 : 0.04, clippingPlanes: planes, clipShadows: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = mesh.receiveShadow = true; mesh.matrixAutoUpdate = false;
      const capMat = capMaterial(p.color || '#c8ccd2', planes);
      const cap = new THREE.Mesh(geo, capMat);
      cap.matrixAutoUpdate = false; cap.visible = false; cap.renderOrder = 1;
      scene.add(mesh); scene.add(cap);
      geo.computeBoundingBox();
      const rec = { p, mesh, cap, mat, capMat, hull: dm.hull, place: rowMajor(p.place), group: p.group || 0, world: new M4(), off: new V3(), dir: new V3(), hidden: false };
      mesh.userData.rec = rec; parts[p.name] = rec; list.push(rec);
    }

    // tether line: unit cylinders (along y) instanced per segment, radius >= ~1.3 px on screen
    const LN = decodeLine(data.tracks.line);
    let line = null;
    if (LN && LN.max > 1) {
      const lg = new THREE.CylinderGeometry(1, 1, 1, 8, 1, false);
      const lm = new THREE.MeshStandardMaterial({ color: new THREE.Color('#ff9a1f').convertSRGBToLinear(), roughness: 0.5, metalness: 0,
        emissive: new THREE.Color('#ff9a1f').convertSRGBToLinear(), emissiveIntensity: 0.25 });
      line = new THREE.InstancedMesh(lg, lm, LN.max - 1); line.count = 0; line.frustumCulled = false; line.castShadow = true;
      line.renderOrder = 2; scene.add(line);
    }
    const linePts = [];
    function lineAt(s) {
      linePts.length = 0; if (!LN) return linePts;
      const n = LN.cnt.length; s = Math.max(0, Math.min(n - 1, s));
      const i = Math.min(Math.max(0, n - 2), Math.floor(s)), f = n > 1 ? s - i : 0, j = Math.min(n - 1, i + 1);
      const ci = LN.cnt[i], cj = LN.cnt[j], P = LN.p;
      if (ci === cj && j !== i) {
        const a = 3 * LN.off[i], b = 3 * LN.off[j];
        for (let k = 0; k < 3 * ci; k += 3) linePts.push(P[a + k] + (P[b + k] - P[a + k]) * f, P[a + k + 1] + (P[b + k + 1] - P[a + k + 1]) * f, P[a + k + 2] + (P[b + k + 2] - P[a + k + 2]) * f);
      } else {
        const m = f < 0.5 ? i : j, a = 3 * LN.off[m];
        for (let k = 0; k < 3 * LN.cnt[m]; k++) linePts.push(P[a + k]);
      }
      return linePts;
    }
    const lq = new Q(), lv = new V3(), lu = new V3(0, 1, 0), ls = new V3(), lmtx = new M4(), lmid = new V3();
    function updateLine() {
      if (!line) return;
      const pts = linePts, ns = pts.length / 3 - 1;
      const pxk = 2 * Math.tan(cam.fov * D2R / 2) / Math.max(1, renderer.domElement.clientHeight || container.clientHeight);
      let k = 0;
      for (let i = 0; i < ns; i++) {
        lv.set(pts[3 * i + 3] - pts[3 * i], pts[3 * i + 4] - pts[3 * i + 1], pts[3 * i + 5] - pts[3 * i + 2]);

<script>

        const k = f >= 1 || fixedF != null ? 1 : 0.12;
        camT.lerp(gt, k); camR += (gr - camR) * k;
        const c = V.camGet(); V.cam(camT.toArray(), camR, c.az, c.el);
        if (f >= 1 && camT.distanceTo(gt) < 1e-3) anim = false;
      } else if (f >= 1) anim = false;
    }
  }
  function frame(now) {
    if (!V.frozen()) step(now);
    V.renderIfNeeded(); requestAnimationFrame(frame);
  }
  // shots: pose the current step at a fixed animation fraction f (0 = start of the fly-in, 1 = settled, camera
  // snapped), render once and stop redrawing until the next go()
  function freezeAt(f) {
    fixedF = Math.max(0, Math.min(1, +f)); anim = true; userCam = false;
    step(performance.now()); V.render(); V.freeze(true);
  }
  V.view(-50, 30, 0.9); camR = V.camGet().r;
  go(0);
  window.ASM_GO = (i, instant) => { go(+i, !!instant); };
  window.ASM_FREEZE = freezeAt;
  window.ASM = { go: window.ASM_GO, freeze: freezeAt, steps: STEPS, viewer: V };
  requestAnimationFrame(frame);
  window.READY = true;
});

</script>
