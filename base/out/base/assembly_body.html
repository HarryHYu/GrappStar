<title>GrappStar drum + frame + launch + reel + sensors assembly steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--gl:max(16px, env(safe-area-inset-left, 0px));--gr:max(16px, env(safe-area-inset-right, 0px));--bg:#eef1f4;--panel:#ffffffeb;--ink:#15181c;--mute:#5b6470;--line:#d5dae0;--acc:#c46d00;--chip:#f4f6f8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16191d;--panel:#1e2228eb;--ink:#e9edf1;--mute:#9aa4ae;--line:#343b44;--acc:#ffb020;--chip:#262b32}}
:root[data-theme="dark"]{--bg:#16191d;--panel:#1e2228eb;--ink:#e9edf1;--mute:#9aa4ae;--line:#343b44;--acc:#ffb020;--chip:#262b32}
html,body{margin:0;height:100%;
  background:var(--bg);color:var(--ink);font:13px/1.45 Arial,Helvetica,sans-serif;overflow:hidden}
#view{position:fixed;inset:0}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-sizing:border-box}
#card{left:var(--gl);top:12px;width:370px;max-width:calc(100vw - var(--gl) - var(--gr));max-height:calc(100vh - 150px);overflow:auto}
#card h1{font-size:13px;margin:0 0 6px;color:var(--mute);font-weight:normal}
#st{font-weight:bold;font-size:16px;color:var(--acc)}
#sd{margin:6px 0 8px}
#count{color:var(--mute);font-size:12px;margin-bottom:4px}
table{border-collapse:collapse;width:100%;font-size:12px}
th{text-align:left;color:var(--mute);font-weight:normal;border-bottom:1px solid var(--line);padding:2px 4px 2px 0}
td{border-bottom:1px solid var(--line);padding:3px 4px 3px 0;vertical-align:top}
td .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;border:1px solid #0003}
td .d{color:var(--mute);font-size:11px;font-weight:normal}
tr.new td:first-child{font-weight:bold}
#nav{left:var(--gl);right:var(--gr);bottom:max(12px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#steps{display:flex;flex-wrap:wrap;gap:4px}
button{font:12px Arial,Helvetica,sans-serif;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--chip);color:var(--ink);cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc);font-weight:bold}
button.done{color:var(--mute)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:5px;max-width:280px;display:none;font-size:12px;z-index:5}
@media (max-width:760px){
  #card{width:auto;right:var(--gr);max-height:42vh;padding:8px 10px}
  #card table{display:none}#card.more table{display:table}#count::after{content:" (tap for the parts)"}
  #steps{display:none}
}
</style>
<div id="view"></div>
<div class="panel" id="card">
  <h1 id="ttl"></h1>
  <div id="st"></div>
  <div id="sd"></div>
  <div id="count"></div>
  <table><thead><tr><th>part</th><th>qty</th><th>material</th></tr></thead><tbody id="bill"></tbody></table>
</div>
<div class="panel" id="nav">
  <div class="row"><button id="prev">previous</button><button id="next">next</button><button id="replay">replay</button><button id="recam">reset camera</button><button id="theme">theme</button>
    <label><input type="checkbox" id="ghost"> ghost earlier parts</label></div>
  <div id="steps"></div>
</div>
<div id="tip"></div>

andle":["frame_deck_1","frame_deck_2","frame_deck_3","frame_deck_4","frame_deck_ext"],"subsystem":"frame","auto":false,"stage":101,"band":"deck","label":"deck 101","seq":2,"warnings":[],"heading":"Step 3 (deck 101): Drill the rover"},{"title":"Deck on the rover","text":"Slide the tiles together on the dovetails (from above). M3 x 25 SHCS down through every perimeter hole, washer and nyloc under the rover plate. Snug, not crushed. Do this before the other subsystems put their feet down: some rover bolts sit under their feet.","parts":[],"handle":["frame_deck_1","frame_deck_2","frame_deck_3","frame_deck_4","frame_deck_ext"],"subsystem":"frame","auto":false,"stage":102,"band":"deck","label":"deck 102","seq":3,"warnings":[],"heading":"Step 4 (deck 102): Deck on the rover"},{"title":"Motor plate","text":"Hold the motor plate upright (front face, the side without the bridge, towards +y) with its bridge against the top of the leg. 2 x M3 x 12 along y through the leg's long counterbores into the bridge inserts.","parts":[],"handle":["frame_cheek_r"],"subsystem":"frame","auto":false,"stage":110,"band":"motor","label":"motor 110","seq":4,"warnings":[],"heading":"Step 5 (motor 110): Motor plate"},{"title":"Wiper motor on the puck (bench)","text":"Battery unplugged. Put the M6 bolts through the puck slots from the front (heads sit in the slot counterbores), into the motor bosses (threaded bosses, or a nut behind each boss ear). Slide the motor so its shaft is centred in the bore (a 10 mm drill shank in the coupler bore helps), then tighten.","parts":["frame_wiper_motor","frame_wiper_shaft"],"handle":["frame_motor_adapter"],"subsystem":"frame","auto":false,"stage":111,"band":"motor","label":"motor 111","seq":5,"warnings":[],"heading":"Step 6 (motor 111): Wiper motor on the puck (bench)"},{"title":"Puck into the plate","text":"Feed the puck into the plate window from behind (the motor side) until its lip sits on the plate's rear face. From the front, M3 x 12 through the plate into the lip inserts (7 of the 8 rim holes have both plate and lip; use those).","parts":[],"handle":["frame_motor_adapter"],"subsystem":"frame","auto":false,"stage":112,"band":"motor","label":"motor 112","seq":6,"warnings":[],"heading":"Step 7 (motor 112): Puck into the plate"},{"title":"Motor leg","text":"Stand the leg on the deck in the corner between the reel and the bay, foot along y. 4 x M3 x 10 down through the foot into the deck inserts.","parts":["frame_motor_leg"],"handle":[],"subsystem":"frame","auto":false,"stage":113,"band":"motor","label":"motor 113","seq":7,"warnings":[],"heading":"Step 8 (motor 113): Motor leg"},{"title":"Can stay","text":"Post against the plate's rear face, 2 x M3 x 12 into the plate inserts. Cable tie or hose clamp round the motor can through the two cradle slots, firm but not crushing.","parts":["frame_can_stay"],"handle":[],"subsystem":"frame","auto":false,"stage":114,"band":"motor","label":"motor 114","seq":8,"warnings":[],"heading":"Step 9 (motor 114): Can stay"},{"title":"Shafts and trains (other subsystems)","text":"Now cad-drum (coupler on the wiper shaft, SW_INDEX block on the strut of idler post 2: drum step \"Main shaft: index contact\"), cad-reel and cad-launch install their trains and aim housing. Follow their steps, then come back.","parts":[],"handle":[],"subsystem":"frame","auto":false,"stage":119,"band":"motor","label":"motor 119","seq":9,"warnings":[],"heading":"Step 10 (motor 119): Shafts and trains (other subsystems)"},{"title":"Drum: bracket A, axle, drum A","text":"Bolt bracket A to the deck (2 x M3 x 12). Press the drum axle into it (flat facing forward). Slide drum A onto the axle, gear first, and turn it so the gap in its lock ring faces back toward the idler position (about drum 180 on the pointer). The shift rail goes in after the idler.","parts":["drum_bracket_a","drum_axle","drum_drum_a"],"handle":[],"subsystem":"drum","auto":false,"stage":130,"band":"drum_core","label":"drum_core 130","seq":10,"warnings":[],"heading":"Step 11 (drum_core 130): Drum: bracket A, axle, drum A"},{"title":"Drum: wrap idler","text":"Push the idler output gear onto the idler shaft flat from the long end. Slide idler post 2 onto the short journal and idler post 1 onto the long journal (the thick middle of the shaft sits between the posts and locates it). Fit this before cad-reel's bus gear, SW_ARM bracket and cup gear. Lower the posts with the idler onto the deck about 4 mm to the back (-x) of their place, then slide them forward so the small pinion meshes the drum A segment teeth, and bolt them down (2 x M3 x 12 each; the front screw of post 2 needs the short arm of the hex key). Turn drum A back to LAUNCH (mark L at the top): the flat-sided lock cam must sit in the drum lock ring and the idler can no longer turn by hand.","parts":["drum_idler_gear","drum_idler","drum_bracket_idler","drum_bracket_idler2"],"handle":[],"subsystem":"drum","auto":false,"stage":140,"band":"drum_idler","label":"drum_idler 140","seq":11,"warnings":[],"heading":"Step 12 (drum_idler 140): Drum: wrap idler"},{"title":"Drum: shift rail","text":"Slide the shift rail in from the outboard end, over the idler posts, and press it into bracket A (flat facing forward).","parts":["drum_rail"],"handle":[],"subsystem":"drum","auto":false,"stage":145,"band":"main_shaft","label":"main_shaft 145","seq":12,"warnings":[],"heading":"Step 13 (main_shaft 145): Drum: shift rail"},{"title":"Main shaft: coupler and limiter","text":"Push the coupler hub onto the wiper output shaft (flats in line) until it stops on the end of the flats; its lower end goes into the puck bore, just clear of the motor's output boss. Drop the M8 nut into the hub pocket onto the thread (it sits about 8 mm down the pocket) and tighten it with a 13 mm socket (1/4 inch drive). Slide the outer coupler over the hub, line up the holes, push a shear pin in (head outside, its flat facing the outboard end) and put a piece of tape round the coupler over the head. Print the pins lying on their flat (D44: shear across the layers). Keep the 5 spare pins with the base. A broken pin stub comes out with an M3 screw turned into it. Then slide the REEL gear onto the coupler journal (plain face first) and screw the retaining washer to the journal end (2 x M3 x 6): the gear must spin free (it cannot go on once the dog post is fitted).","parts":["drum_coupler_hub","drum_coupler","drum_shear_pin","drum_gear_reel","drum_reel_washer"],"handle":[],"subsystem":"drum","auto":false,"stage":146,"band":"main_shaft","label":"main_shaft 146","seq":13,"warnings":[],"heading":"Step 14 (main_shaft 146): Main shaft: coupler and limiter"},{"title":"Main shaft: index contact","text":"Press an M3 nut into the index block pocket, screw the index lever foot to the block (M3 x 12), thread an M3 x 6 into the lever boss, head toward the nut. Screw the block to the inner face of the strut of idler post 2 (2 x M3 x 12 from the far side of the post into the block), with the nub on the coupler cam. Set the gap so the screw head touches the nut near the top of a bump (about 1.5 mm on a low part). Battery unplugged: nut to GND, screw to SW_INDEX.","parts":["drum_index_block","drum_index_lever"],"handle":[],"subsystem":"drum","auto":false,"stage":147,"band":"main_shaft","label":"main_shaft 147","seq":14,"warnings":[],"heading":"Step 15 (main_shaft 147): Main shaft: index contact"},{"title":"Screw the reel wall to the deck","text":"Stand the reel wall on the deck at its marked place (its long foot reaches back onto the deck extension tile). Put nine M3 screws down through the counterbored foot holes into the deck inserts and tighten. Do this first: the gears later cover some of the holes.","parts":["reel_wall"],"handle":[],"subsystem":"reel","auto":false,"stage":150,"band":"reel_capstan","label":"reel_capstan 150","seq":15,"warnings":[],"heading":"Step 16 (reel_capstan 150): Screw the reel wall to the deck"},{"title":"Sleeve, bus gear, swing arm and swing idler","text":"Push the sleeve into the big hole in the wall from the front, its rib in the slot, flange flat on the wall, and screw it on with three M3 x 8 screws (they tap into the wall). From behind slide the 46-tooth bus gear onto the sleeve, gear face first, hub toward you, and snap the large C-clip into the groove behind the hub. Slip the swing arm's ring over the bus gear's hub, idler pin pointing at the wall, and put the 30-tooth swing idler on the pin. The arm swings 12 degrees between its two stop pins.","parts":["reel_sleeve","reel_sleeve_clip","reel_bus","reel_swing_arm","reel_gi"],"handle":[],"subsystem":"reel","auto":false,"stage":151,"band":"reel_capstan","label":"reel_capstan 151","seq":16,"warnings":[],"heading":"Step 17 (reel_capstan 151): Sleeve, bus gear, swing arm and swing idler"},{"title":"Cup shaft, cup gear and riser gear","text":"Push the cup shaft through the sleeve from BEHIND, flat end first, until it comes out in front of the wall. Behind: slide the 24-tooth cup gear onto the flat (hub forward, raised track toward you) and snap its C-clip on. In front: slide the 30-tooth riser gear onto the flat and snap its C-clip on. The cup shaft must turn freely.","parts":["reel_k","reel_gk","reel_k_clip","reel_gk1","reel_k_clip2"],"handle":[],"subsystem":"reel","auto":false,"stage":152,"band":"reel_capstan","label":"reel_capstan 152","seq":17,"warnings":[],"heading":"Step 18 (reel_capstan 152): Cup shaft, cup gear and riser gear"},{"title":"Riser idlers and K2","text":"Push the two idler axle pins through the 34-tooth and the 30-tooth riser idlers and press them into their holes in the wall front (34 teeth next to the cup shaft gear). Push the K2 stub through its wall bushing from the front with its 30-tooth gear and the 18-tooth bevel on the flats, the bevel teeth facing you, and snap its C-clip on behind the wall. Turn the cup gear: the whole riser turns.","parts":["reel_ik1","reel_ik1_axle","reel_ik2","reel_ik2_axle","reel_k2","reel_gk2","reel_bk2"],"handle":[],"subsystem":"reel","auto":false,"stage":153,"band":"reel_capstan","label":"reel_capstan 153","seq":18,"warnings":[],"heading":"Step 19 (reel_capstan 153): Riser idlers and K2"},{"title":"Countershaft C and the REEL idler","text":"Slide the 20-tooth C bevel onto the front of countershaft C (teeth facing away from the shaft), feed the shaft through its wall bushing from the front, and from behind slide the 22-tooth C gear onto the flat and snap its C-clip on. Push the REEL idler axle through the 41-tooth idler and press it into the wall from behind: the idler meshes the drum's REEL gear and the C gear.","parts":["reel_cs","reel_bc","reel_gc","reel_cs_clip","reel_ic","reel_ic_axle"],"handle":[],"subsystem":"reel","auto":false,"stage":154,"band":"reel_capstan","label":"reel_capstan 154","seq":19,"warnings":[],"heading":"Step 20 (reel_capstan 154): Countershaft C and the REEL idler"},{"title":"Clutch hub","text":"Press one 608 bearing into each end of the clutch hub. Lay the friction disc on the front, its slots on the three lugs, raised ring outward. Slide the hub onto the reel shaft from the shaft's thin end until the disc meets the shaft's round head. Slide the thrust ring onto the shaft behind the hub, small boss toward the bearing.","parts":["reel_hub","reel_hub_flange","reel_brg_1","reel_brg_2","reel_s","reel_t"],"handle":[],"subsystem":"reel","auto":false,"stage":155,"band":"reel_capstan","label":"reel_capstan 155","seq":20,"warnings":["reel_brg_1, reel_brg_2, reel_hub, reel_hub_flange, reel_s, reel_t rest only on parts placed later (by 'Brake crank, rocker and bar', 'Reel shaft into the wall', 'T2 take-off')"],"heading":"Step 21 (reel_capstan 155): Clutch hub"},{"title":"Brake crank, rocker and bar","text":"Grease the crank boss low on the left of the wall front. Slide the black bell crank onto it: the short arm lies in the recess in the wall and points right, the long arm sticks straight out from the wall. Put the printed washer on the boss and screw the M3 x 20 into it: the crank must swing freely. Screw the M3 x 10 FIRM screw into the rocker's leg from the front with its nut on the front face, until 0.35 mm of its tip shows at the back. Hang the yellow rocker between the two ears at the top with an M3 x 25 screw and nut (snug, it must swing); its round hole goes over the small boss, its leg rests on the small pad on the wall, the FIRM screw tip just above the crank's short arm. Screw two M3 x 8 screws into the rocker's two bosses from behind, until their tips stand 0.5 mm proud of the front. Lay the brake bar in the two U guides, its raised lug against the crank's long arm, nose toward the drum. Close each guide with its cap and two M3 x 16 screws. Push the nose: the crank swings and the rocker leg moves away from the wall; let go and it all springs back.","parts":["reel_crank","reel_crank_washer","reel_crank_screw","reel_firm_screw","reel_rocker","reel_rocker_pin","reel_trim_screws","reel_bar","reel_bar_cap_1","reel_bar_cap_2","reel_bar_screws"],"handle":[],"subsystem":"reel","auto":false,"stage":156,"band":"reel_capstan","label":"reel_capstan 156","seq":21,"warnings":[],"heading":"Step 22 (reel_capstan 156): Brake crank, rocker and bar"},{"title":"Reel shaft into the wall","text":"Feed the reel shaft's thin end through the rocker's hole and the wall bushing from the front. From behind, slide the 20-tooth reel gear onto the D-flat, hub toward the wall, and snap its C-clip on. Swing the arm toward the reel gear (to its stop): the idler meshes it.","parts":["reel_gr","reel_s_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":157,"band":"reel_capstan","label":"reel_capstan 157","seq":22,"warnings":[],"heading":"Step 23 (reel_capstan 157): Reel shaft into the wall"},{"title":"T2 take-off","text":"Push the T2 stub through its wall bushing from the front with the 40-tooth T2 gear and the 20-tooth T bevel on its flats (bevel teeth facing you): the T2 gear meshes the clutch hub's teeth. Snap its C-clip on behind the wall. Turn the clutch hub by hand: T2 turns the same speed.","parts":["reel_t2","reel_gt2","reel_bt2"],"handle":[],"subsystem":"reel","auto":false,"stage":158,"band":"reel_capstan","label":"reel_capstan 158","seq":23,"warnings":[],"heading":"Step 24 (reel_capstan 158): T2 take-off"},{"title":"SW_ARM contact","text":"Battery unplugged. Build the printed contact (see the contact switch page): nut pressed in the base trap, lever screwed onto the pad with 2 x M3 x 10 self tapping screws, M3 x 10 contact screw with its jam nut in the lever. Screw the switch base to the bracket with 4 x M3 x 8 self tapping screws, and the bracket to the back of the wall below the gears with two M3 x 8. SW_ARM is closed while the cup is away from home and opens at home: the lever rides a raised track on the back of the cup gear and drops into a notch in it at home. Turn the cup to home (the rear cup's eyelet at the bottom): the lever tip sits free in the notch. Turn the contact screw until its head just touches the nut, then back it off 1.9 turns (gap about 0.9 mm, 0.5 mm per turn) and lock the jam nut.","parts":["reel_sw_bracket","reel_sw_base","reel_sw_lever","reel_sw_hw"],"handle":[],"subsystem":"reel","auto":false,"stage":159,"band":"reel_capstan","label":"reel_capstan 159","seq":24,"warnings":[],"heading":"Step 25 (reel_capstan 159): SW_ARM contact"},{"title":"Drum: fork and dog contacts","text":"Press an M3 nut into the hex hole of the yoke tab. Thread an M3 x 8 into each dog post boss first, heads toward each other (M3 x 8: a longer screw reaches the REEL gear; no room for a driver later). Turn the drum to about 180. Slide the fork sleeve onto the rail, yoke facing the main shaft, and swing it about 20 deg pin end away from the drum while the dog post slides on (its bar reaching back over the yoke tab; fit it before cad-reel's pulley 2). Grease the rail. Tighten the dog post clamp screw (M3 x 8, tapped) onto the rail flat. Battery unplugged: nut wire to GND, REEL side screw to SW_DOG_R, LAUNCH side screw to SW_DOG_L.","parts":["drum_dog_post","drum_fork"],"handle":[],"subsystem":"drum","auto":false,"stage":160,"band":"drum_shift","label":"drum_shift 160","seq":25,"warnings":[],"heading":"Step 26 (drum_shift 160): Drum: fork and dog contacts"},{"title":"Drum: drum B, hand lever, bracket B","text":"Swing the fork up on the rail, slide drum B onto the axle (hex socket over the drum A spigot; it fits one way only, cut corner to filled corner), slide the fork to its middle position and swing it down so its pin drops into the groove (drum near 180). Slide the hand lever onto the hex boss. Press bracket B onto the axle and rail ends and bolt it down (2 x M3 x 12). The drum turns by hand with about 0.6 mm end play.","parts":["drum_drum_b","drum_hand_lever","drum_bracket_b"],"handle":[],"subsystem":"drum","auto":false,"stage":161,"band":"drum_shift","label":"drum_shift 161","seq":26,"warnings":[],"heading":"Step 27 (drum_shift 161): Drum: drum B, hand lever, bracket B"},{"title":"Drum: N20","text":"Press the pinion onto the N20 output shaft (flat to flat) leaving 1.5 mm of shaft below it (that end runs in the bracket A ear slot). Slide the N20 into the cradle from the open end, fit the end plate (2 x M3 x 8). Press an M3 nut into the pocket in the bracket A ear front face, wire along its groove. Screw the cradle to the ear from the cradle side: pivot screw M3 x 12 through the round hole, swing screw M3 x 12 through the arc slot at its full-mesh end (the slot only lets the cradle swing out), both tapped into the ear. Turn the SW_N20 screw (M3 x 8, tapped in the cradle plate) in until its tip just touches the nut. Battery unplugged: nut to GND, screw to SW_N20.","parts":["drum_n20_pinion","drum_n20","drum_n20_cradle","drum_n20_strap"],"handle":[],"subsystem":"drum","auto":false,"stage":162,"band":"drum_shift","label":"drum_shift 162","seq":27,"warnings":[],"heading":"Step 28 (drum_shift 162): Drum: N20"},{"title":"Drum: code switches","text":"Press an M3 nut into each of the 3 front pockets of the switch block and bolt it to the deck (2 x M3 x 12). Screw each lever foot to the block (M3 x 12), nub on its band. Thread an M3 x 6 into each lever boss, head toward the nut, so the head touches the nut near the top of a bump (gap about 1.8 mm with the nub low). Battery unplugged: nuts to GND, screws to SW_DRUM_A (nearest the motor), SW_DRUM_B, SW_DRUM_C.","parts":["drum_switch_block","drum_sw_lever_0","drum_sw_lever_1","drum_sw_lever_2"],"handle":[],"subsystem":"drum","auto":false,"stage":163,"band":"drum_shift","label":"drum_shift 163","seq":28,"warnings":[],"heading":"Step 29 (drum_shift 163): Drum: code switches"},{"title":"Main shaft: stack","text":"Slide the collar onto the main shaft from the spigot end. Lower the shaft with its hex end outboard of the REEL gear dogs (beyond s 70) so the collar groove drops between the fork pads, then push it about 42 mm into the coupler socket. The shaft is held endwise later by the launch sleeve and the magnet cap.","parts":["drum_shaft","drum_collar"],"handle":[],"subsystem":"drum","auto":false,"stage":170,"band":"main_stack","label":"main_stack 170","seq":29,"warnings":[],"heading":"Step 30 (main_stack 170): Main shaft: stack"},{"title":"Main shaft: LAUNCH dog ring and magnet cap","text":"Fit the LAUNCH dog ring on the launch sleeve flange (sleeve lugs in the ring slots, 3 x M3 x 10 from the sleeve side into the ring) before the launch sleeve goes on the spigot (launcher steps). After the launcher: glue the AS5600 magnet into the cap, push the cap on the spigot end (flat to flat) and fit the M3 x 6 onto the flat. Hand use of the drum: battery unplugged, slacken the line, loosen the swing screw, swing the N20 out, turn the lever, swing back and tighten.","parts":["drum_dogring_launch","drum_magnet_cap"],"handle":[],"subsystem":"drum","auto":false,"stage":171,"band":"main_stack","label":"main_stack 171","seq":30,"warnings":[],"heading":"Step 31 (main_stack 171): Main shaft: LAUNCH dog ring and magnet cap"},{"title":"Lane tabs and the lane T front post","text":"Screw the lane C tab and the lane K tab to the wall front, each with two M3 x 10 (they tap into the wall). Screw the lane T front post to the deck extension with two M3 screws into the inserts.","parts":["reel_tab_c","reel_tab_k","reel_post_t"],"handle":[],"subsystem":"reel","auto":false,"stage":180,"band":"reel_storage","label":"reel_storage 180","seq":31,"warnings":[],"heading":"Step 32 (reel_storage 180): Lane tabs and the lane T front post"},{"title":"Reel unit: P1, sprag #2, capstan tube","text":"Screw the P1 leg to the deck extension and bolt P1 onto it (one M3 x 16). Slide the capstan tube in from the FRONT, D-flat end first, until its collar sits on P1's bushing.","parts":["reel_p1","reel_p1_leg","reel_c"],"handle":[],"subsystem":"reel","auto":false,"stage":181,"band":"reel_storage","label":"reel_storage 181","seq":32,"warnings":[],"heading":"Step 33 (reel_storage 181): Reel unit: P1, sprag #2, capstan tube"},{"title":"Lanes along the deck","text":"Slide each bevel onto its lane's front end (teeth toward the front). Feed lane C (d12) from the front through the lane C tab and P1, its bevel meshing the C bevel; lane K (d8) through the lane K tab and P1, its bevel meshing the K2 bevel; lane T (d8) through the front post and the P1 leg, its bevel meshing the T2 bevel. Slide the lane T rear bevel onto lane T (teeth toward the front).","parts":["reel_lane_c","reel_bcx","reel_lane_k","reel_bkx","reel_lane_t","reel_btx","reel_bt3x"],"handle":[],"subsystem":"reel","auto":false,"stage":182,"band":"reel_storage","label":"reel_storage 182","seq":33,"warnings":[],"heading":"Step 34 (reel_storage 182): Lanes along the deck"},{"title":"Cheeks, T bracket, spool and spool shaft","text":"Press a 608 into each cheek. Screw both cheeks and the T bracket to the deck extension (M3 into the inserts). Hold the spool between the cheeks and push the spool shaft from the inboard side through the T bracket, the inboard 608, the spool (flat in the flat) and the outboard 608; slide the 16-tooth gear onto its inboard end. Put T3 with its bevel and 16-tooth gear into the T bracket: its bevel meshes the lane T rear bevel. Press the idler axle through the 34-tooth take-up idler into the bracket so it meshes both 16-tooth gears.","parts":["reel_cheek_i","reel_cheek_o","reel_brg_3","reel_brg_4","reel_t_bracket","reel_spool","reel_ss","reel_gs","reel_t3","reel_bt3","reel_gt3","reel_ti","reel_ti_axle"],"handle":[],"subsystem":"reel","auto":false,"stage":183,"band":"reel_storage","label":"reel_storage 183","seq":34,"warnings":[],"heading":"Step 35 (reel_storage 183): Cheeks, T bracket, spool and spool shaft"},{"title":"Drum, cup and the C plane","text":"Slide the green drum onto the front of the capstan tube, flange first, key slot on the rib. Push the rear cup shaft through the tube from the FRONT, plain end first. Slide the wrap cup onto its front end, flat on the flat, eyelet at the BOTTOM, and push Harry's small C-clip onto the neck. Behind P1: slide G_c (20 teeth, m2) onto the tube's flat and clip it; slide G_a onto lane C's flat. Press sprag #2 (CSK20PP) into the 58-tooth idler's hub, key slot on the printed rib. Check the arrow: the idler must turn freely the way it turns when the capstan winds in and lock the other way (turn the capstan by hand once assembled: wind-in free, payout locked). Push the keyed I_c axle from the front through P1 and the sprag (key in the keyway, flat in P1's flat) and clip it behind the idler.","parts":["reel_drum","reel_kc","reel_cup","reel_cup_clip","reel_gc2","reel_c_clip","reel_ga","reel_sprag","reel_icr","reel_icr_axle"],"handle":[],"subsystem":"reel","auto":false,"stage":184,"band":"reel_storage","label":"reel_storage 184","seq":35,"warnings":[],"heading":"Step 36 (reel_storage 184): Drum, cup and the C plane"},{"title":"K plane, P2 and the line","text":"Slide G_k (20 teeth) onto the rear cup shaft and G_a' onto lane K. Press the I_k axle through the 76-tooth idler into P2's front face. Put the three spacer tubes on P1's screws, offer P2 up so the cup shaft and lane K enter its journals and I_k meshes both gears, and bolt it to the spacers, its leg and the two cheeks; clip the cup shaft behind P2. Turn the cup to home (eyelet at the bottom). Wind the line onto the spool (line over the TOP, leaving toward the front), lead it under the capstan and through the cup eyelet from behind, then straight forward to the pulley at the rail's rear end. Set LIGHT with the drum at LAUNCH: turn both trim screws the same amount until 25 g hung on the line end just pulls line off slowly (0.25 N) and 20 g does not. Set FIRM last, with the drum in REEL: the line must slip at 5.0 N on the luggage scale (FIRM screw in = more).","parts":["reel_gkc","reel_ga2","reel_ikr","reel_ikr_axle","reel_spacer_1","reel_spacer_2","reel_spacer_3","reel_p2","reel_p2_leg","reel_kc_clip"],"handle":[],"subsystem":"reel","auto":false,"stage":185,"band":"reel_storage","label":"reel_storage 185","seq":36,"warnings":[],"heading":"Step 37 (reel_storage 185): K plane, P2 and the line"},{"title":"Launcher 1: print the parts","text":"All PLA unless named. PPA-CF: big gear, drive gear, launch sleeve, big gear pin, SW_SEATED plunger and pushrod, and the aim gears (sun, idler, output, bevel, worm, crank). Use each part's print orientation from the print sheet: the carriage body lies on its side across the bed diagonal; the stop springs print upside down at 100 percent infill (all perimeters); rail pieces lie on their largest flat face. 0.2 mm layers, 4 walls on every loaded part. Hardware (launcher and aim train): M3 screws 2 x 6, 3 x 8, 14 x 10, 23 x 12, 5 x 16, 15 x 20, 4 x 30, plus 4 x 10 for the aim housing to the deck (Aim 3); 10 M3 nuts, 4 M3 nylocs; M8 x 25 bolt and M8 nut; 2 x 608; 4 x 693ZZ (3 tether pulleys, 1 lip roller); 2 x 8 mm steel rod pins (cut to the length on the print sheet) for the spring anchors; sprag #1 (CSK20PP); the two springs.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":190,"band":"launcher","label":"launcher 190","seq":37,"warnings":[],"heading":"Step 38 (launcher 190): Launcher 1: print the parts"},{"title":"Launcher 2: join the rail","text":"Lay the rear, mid and front rail pieces in a line on a flat table. Push each joint together and fit 2 x M3 x 20 with nuts through each flange pair (8 in total). Tighten evenly; file any step inside the track where the pieces meet so the carriage shoes slide over it.","parts":["launch_rail_rear","launch_rail_mid","launch_rail_front"],"handle":[],"subsystem":"launch","auto":false,"stage":191,"band":"launcher","label":"launcher 191","seq":38,"warnings":["launch_rail_front, launch_rail_mid, launch_rail_rear rest only on parts placed later (by 'Launcher 2b: splice straps and aim lug', 'Launcher 3: big gear', 'Launcher 4: drive gear, sprag #1 and the launch sleeve', 'Launcher 5: carriage' and 7 more)"],"heading":"Step 39 (launcher 191): Launcher 2: join the rail"},{"title":"Launcher 2b: splice straps and aim lug","text":"Screw a splice strap on each wall top across the front joint (4 x M3 x 10 self tap each). Bolt the aim lug to the left rail wall now (2 x M3 x 12 self tap): the spring guards cover its screws later.","parts":["launch_rail_splice_l","launch_rail_splice_r","launch_aim_lug"],"handle":[],"subsystem":"launch","auto":false,"stage":192,"band":"launcher","label":"launcher 192","seq":39,"warnings":[],"heading":"Step 40 (launcher 192): Launcher 2b: splice straps and aim lug"},{"title":"Launcher 3: big gear","text":"Hold the big gear between the two cheeks of the mid piece, the toothed sector towards the drum side (right) and the full ring of teeth towards the left, with the spacer washer between the gear and the left cheek. Push the big gear pin through cheek, gear, washer, cheek from the right and snap the C clip into its groove. The gear must spin freely with almost no end play.","parts":["launch_big_gear","launch_gear_pin","launch_gear_clip","launch_gear_washer"],"handle":[],"subsystem":"launch","auto":false,"stage":193,"band":"launcher","label":"launcher 193","seq":40,"warnings":[],"heading":"Step 41 (launcher 193): Launcher 3: big gear"},{"title":"Launcher 4: drive gear, sprag #1 and the launch sleeve","text":"First bolt cad-drum's LAUNCH dog ring to the sleeve flange: lugs in the ring slots, 3 x M3 x 8 from the flange side into the tapped ring (the heads are out of reach once the sleeve is in the cheeks). Slide sprag #1 into the drive gear so its outer keyway takes the rib inside the gear. Check the direction: look at the gear from its collar side (the side that goes to the right, towards the motor), hold the gear and turn the inner race with a finger. It must turn freely counter-clockwise (BACKWARD) and lock clockwise (FORWARD: clockwise seen from the motor side is the cock direction). If it is the other way round, push the sprag out, turn it over and slide it in other face first. Hold the drive gear between the cheeks (collar side right, then the spacer washer on its left), meshing the big gear's full ring of teeth. Turn the cheek bores so their slots point down, then push the launch sleeve in from the motor side, outboard end first, ribs lined up with the slots and the sprag keyway, until the long (15 mm) rib sits inside the sprag.","parts":["launch_drive_gear","launch_sprag","launch_sleeve","launch_drive_washer"],"handle":[],"subsystem":"launch","auto":false,"stage":194,"band":"launcher","label":"launcher 194","seq":41,"warnings":[],"heading":"Step 42 (launcher 194): Launcher 4: drive gear, sprag #1 and the launch sleeve"},{"title":"Launcher 5: carriage","text":"Turn the big gear so its toothless gap faces the rack. Slide the carriage BODY into the track from the FRONT end (the tether fork blocks the rear), rack teeth down, until its rear face reaches the stop position. Yoke: push the SW_SEATED pushrod into the block bore from the rear, collar first, then push the plunger's pin up through the block from below (pad under the left arm) and press the head cap on the pin top. Lower the yoke onto the carriage rear so its key plates drop into the slots in the body webs, and fit 1 x M3 x 10 per side through the yoke into the webs. Press a printed spring peg up into each inner (y 38) peg hole from below, flat to the rear, to the end of the hole.","parts":["launch_carriage","launch_carriage_yoke","launch_seat_plunger","launch_seat_pushrod","launch_seat_clip","launch_yoke_peg_l","launch_yoke_peg_r"],"handle":[],"subsystem":"launch","auto":false,"stage":195,"band":"launcher","label":"launcher 195","seq":42,"warnings":[],"heading":"Step 43 (launcher 195): Launcher 5: carriage"},{"title":"Fit the remaining launch parts","text":"Parts without an explicit assembly step: launch_dart.","parts":["launch_dart"],"handle":[],"subsystem":"launch","auto":true,"stage":null,"band":"","label":"","seq":43,"warnings":[],"heading":"Step 44: Fit the remaining launch parts"},{"title":"Launcher 5b: lip roller","text":"Press a 693ZZ into the lip roller, put a printed thrust washer each side in its bore (hub to the bearing), drop roller and washers into the fork at the carriage front and fit the M3 x 16 and a nyloc nut; it must spin freely. The tether runs over it in tow and retrieval, and the dart's tail slides in over it through the funnel onto the cradle.","parts":["launch_muzzle_roller","launch_muzzle_roller_brg","launch_muzzle_roller_axle","launch_muzzle_washer_l","launch_muzzle_washer_r"],"handle":[],"subsystem":"launch","auto":false,"stage":196,"band":"launcher","label":"launcher 196","seq":44,"warnings":[],"heading":"Step 45 (launcher 196): Launcher 5b: lip roller"},{"title":"Launcher 6: carriage stop frames","text":"For each side, before any spring: slide the stop frame onto the rail from the outboard side (it does not drop straight down past the inboard preload ledge). 2 x M3 x 12 through the rear foot into the rail wall, and 2 x M3 x 16 down through the front foot into the rail front plate, driven through the access holes in the frame's front wall.","parts":["launch_stop_frame_l","launch_stop_frame_r"],"handle":[],"subsystem":"launch","auto":false,"stage":197,"band":"launcher","label":"launcher 197","seq":45,"warnings":[],"heading":"Step 46 (launcher 197): Launcher 6: carriage stop frames"},{"title":"Launcher 6b: spring guards","text":"Screw the spring guard plates to the rail walls and anchor posts (M3 self tap into the pilots, see the print sheet), four per side: a (rear, with the end wall), b1 and b2 (either side of the stop frame's rear leg) and c (front, 2 x M3 x 12 into the front plate edge). Slide each one in from the side, under the stop frame's outboard bar. Wall brackets: M3 x 12 self tap, head and hex key through the hole in the plate; b2 foot: M3 x 10 down. Never cock with a guard off.","parts":["launch_guard_l_a","launch_guard_l_b1","launch_guard_l_b2","launch_guard_l_c","launch_guard_r_a","launch_guard_r_b1","launch_guard_r_b2","launch_guard_r_c"],"handle":[],"subsystem":"launch","auto":false,"stage":198,"band":"launcher","label":"launcher 198","seq":46,"warnings":[],"heading":"Step 47 (launcher 198): Launcher 6b: spring guards"},{"title":"Launcher 6c: stop springs","text":"Put each stop spring on its ledges inside its frame, rear bar towards the yoke arm, and pull it onto the frame's front wall with the 2 x M3 x 20 draw screws (heads on the front wall), a turn each in turn, until it sits on the wall (6.6 mm of preload). The rear bar must rest on both ledges.","parts":["launch_stop_spring_l","launch_stop_spring_r"],"handle":[],"subsystem":"launch","auto":false,"stage":199,"band":"launcher","label":"launcher 199","seq":47,"warnings":[],"heading":"Step 48 (launcher 199): Launcher 6c: stop springs"},{"title":"Launcher 7: contacts","text":"SW_HOME (right lip) and SW_SEATED (left lip): drop an M3 nut into the slot in the rail wall with a stripped wire end under it. Put a ring lug (or a stripped wire end wrapped once) on an M3 x 6 under its head and screw it up into the lever's boss, head down, until the tip is flush with the boss top (the pad beside it must stay the highest point), then screw the lever root to the lip with one M3 x 10 (self tap). Set the gap with the carriage pushed back at least 10 mm (lever free): turn the screw down until the head just touches the nut (meter beeps), then back it off ONE full turn (0.5 mm gap; a dab of nail varnish on the thread holds it). Carriage on its stop: the right foot presses the pad about 0.95 mm and SW_HOME must read closed; 2 mm back it must read open (if not, a quarter turn at a time). SW_SEATED closes only with a dart on the sled (no springs yet: hold the carriage on its stop by hand to check). SW_GAP, SW_RAIL_LOW and the AS5600 carrier are fitted in the Sensors steps (cad-sensors).","parts":["launch_sw_home","launch_sw_home_screw","launch_sw_home_nut","launch_sw_seated","launch_sw_seated_screw","launch_sw_seated_nut"],"handle":[],"subsystem":"launch","auto":false,"stage":200,"band":"launcher","label":"launcher 200","seq":48,"warnings":[],"heading":"Step 49 (launcher 200): Launcher 7: contacts"},{"title":"Launcher 8: time the big gear (fingers clear)","text":"No springs fitted yet. Hold the carriage on its stop by hand and turn the drive gear FORWARD until the first tooth after the toothless gap just touches the rearmost rack tooth: this is HOME (SW_GAP is set to it in the Sensors steps). Turning on pulls the carriage back smoothly; at full cock the cut last tooth lets go (push the carriage home by hand). Hold the drive gear from the side and never put a hand in front of the carriage.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":201,"band":"launcher","label":"launcher 201","seq":49,"warnings":[],"heading":"Step 50 (launcher 201): Launcher 8: time the big gear (fingers clear)"},{"title":"Launcher 9: rail-rear pulley","text":"Press a 693ZZ into the printed pulley. Fit it in the fork at the rail's rear end with a printed top-hat washer on each side (hub toward the bearing) and push the M3 x 20 axle through (nyloc nut on the far side, snug: the pulley must spin). D50: this is the only pulley on the tether. The line comes from the capstan eyelet behind the launcher, runs UNDER this pulley and forward along the rail axis through the pusher hole to the dart's tail cap. Never fire without the tether attached (D11).","parts":["launch_pulley_top","launch_pulley_top_brg","launch_pulley_top_axle","launch_pulley_top_washer_l","launch_pulley_top_washer_r","launch_line_p","launch_line_a0","launch_line_a1","launch_line_a2","launch_line_a3","launch_line_a4","launch_line_a5","launch_line_a6","launch_line_a7","launch_line_a8"],"handle":[],"subsystem":"launch","auto":false,"stage":202,"band":"launcher","label":"launcher 202","seq":50,"warnings":[],"heading":"Step 51 (launcher 202): Launcher 9: rail-rear pulley"},{"title":"Aim 1: aim housing, worm, wheel, crank","text":"Build the aim housing on the bench (it goes onto the base later, after the rail). The AS5600 carrier and SW_RAIL_LOW are cad-sensors parts (Sensors steps), screwed into the pilots on the housing. Push the countershaft in from the inboard side through the inner wall bushing, through the big bevel (D bore, slid on from the outboard end of the shaft) and into the outer wall bushing. Drop the M8 nut into the hex pocket on the inner face of the outer wall, fit the two 608 bearings into the crank (worm wheel) hub, hold the crank in place and push the M8 x 25 bolt in from outboard through the wall, the nut and both bearings; tighten so the head and nut clamp the wall. Lay the worm shaft with the small bevel in its saddles and screw the cap on (4 x M3 x 30 self tap). The housing screws to the deck later (Aim 3), from the top: 4 x M3 x 10 down through the counterbored holes in its foot flanges (two behind the spine, one in front of the outer wall, one on the inboard tab) into the deck's heat-set inserts. The SW_RAIL_LOW bracket on the foot extension has its own deck screw (Sensors 2).","parts":["launch_aim_housing","launch_aim_cap","launch_aim_worm","launch_aim_crank","launch_aim_bolt","launch_aim_brg_1","launch_aim_brg_2","launch_aim_output","launch_aim_bevel30","launch_aim_nut"],"handle":[],"subsystem":"launch","auto":false,"stage":205,"band":"aim","label":"aim 205","seq":51,"warnings":[],"heading":"Step 52 (aim 205): Aim 1: aim housing, worm, wheel, crank"},{"title":"Aim 2: splitter","text":"Slide the sun onto the sleeve's outer rib. On the bench: fit the idler on the swing arm pin and snap the printed C clip into the pin groove, and push the printed drag pad into the arm hub pocket with the shim behind its root block (a thicker shim gives more drag). Then slide the arm onto the sleeve next to the sun (there is no room to fit the idler once the arm is on).","parts":["launch_aim_sun","launch_aim_arm","launch_aim_idler","launch_aim_drag_pad","launch_aim_drag_shim","launch_aim_idler_clip"],"handle":[],"subsystem":"launch","auto":false,"stage":206,"band":"aim","label":"aim 206","seq":52,"warnings":[],"heading":"Step 53 (aim 206): Aim 2: splitter"},{"title":"Aim 3: lug, conrod, rail onto the base","text":"With the sun and swing arm already on the sleeve (the lug is on the rail since Launcher 2b), slide the rail assembly's sleeve along the main axis onto the drum's d12 spigot from the outboard side (the LAUNCH dog ring is already bolted to its flange, Launcher 4) until the ring's dogs sit by the drum collar. Hang the conrod's upper eye on the lug pin and snap a printed C clip into that groove. Then slide the aim housing on from the outboard side so the sleeve end enters its bushing and the crank pin enters the conrod's lower eye (hold the swing arm with the idler pointing down and a little to the rear, clear of the output gear, and let the arm go in between the two stop posts on the housing's inner face as they come up to it); snap a printed C clip onto the crank pin and screw the housing to the deck from the top: 4 x M3 x 10 through the counterbored foot flange holes into the deck inserts. Turn the sleeve backward by hand: the arm swings the idler into the output gear, comes to rest on its engaged stop post and drives the gear without binding; forward, the arm swings out onto the other post and the output gear stays still. Then turn the wiper backward slowly: the rail rises to 47 deg, then lowers to 6 deg.","parts":["launch_aim_conrod","launch_aim_crankpin_clip","launch_aim_lugpin_clip"],"handle":[],"subsystem":"launch","auto":false,"stage":207,"band":"aim","label":"aim 207","seq":53,"warnings":[],"heading":"Step 54 (aim 207): Aim 3: lug, conrod, rail onto the base"},{"title":"Launcher 10: wiring (battery unplugged)","text":"Battery unplugged. Run the SW_HOME, SW_SEATED and SW_GAP wires along the rail to the pivot and leave a 150 mm loop at the main axis before they go to the frame. No wire goes onto the carriage. Each contact: one wire to its ESP32 pin (SW_HOME 21, SW_GAP 39, SW_RAIL_LOW 40, SW_SEATED 41, as params.SWITCHES), the other to GND.","parts":[],"handle":[],"subsystem":"launch","auto":false,"stage":208,"band":"aim","label":"aim 208","seq":54,"warnings":[],"heading":"Step 55 (aim 208): Launcher 10: wiring (battery unplugged)"},{"title":"Sensors 1: build the two contact switches (SW_RAIL_LOW, SW_GAP)","text":"For each switch: press an M3 nut into the hex trap on the base pillar (a drop of glue), solder a wire to the nut through the side slot and lay it in the groove. Screw the lever onto the pad with 2 x M3x10 self tapping screws. Screw an M3x10 through the lever boss from the top, head down, with a ring lug and the second wire under a jam nut on top. Turn the screw until the head touches the nut, then back it off 1.9 turns (gap about 0.9 mm, 0.5 mm per turn) and lock the jam nut.","parts":["sensors_sw_rail_low","sensors_sw_rail_low_lever","sensors_sw_rail_low_screw","sensors_sw_rail_low_jam","sensors_sw_rail_low_nut"],"handle":[],"subsystem":"sensors","auto":false,"stage":210,"band":"sensors","label":"sensors 210","seq":55,"warnings":[],"heading":"Step 56 (sensors 210): Sensors 1: build the two contact switches (SW_RAIL_LOW, SW_GAP)"},{"title":"Sensors 2: SW_RAIL_LOW on the aim housing","text":"Screw the switch base to its bracket (4 x M3x8 self tapping), lever pointing to the crank. Set the bracket foot on the housing foot extension in front of the crank. Screw it down with an M3x10 in the hole nearest the crank (self taps into the housing) and an M3x16 in the counterbored hole at the front end of the foot: down through the foot and the foot extension into the deck insert under it (the bracket's own deck screw). Turn the crank by hand (wiper backwards) to the lowest rail position: the cam lobe presses the lever tip and the meter shows the switch closed. Turn the crank about 20 deg either side: the switch must open.","parts":["sensors_sw_rail_low_bracket"],"handle":[],"subsystem":"sensors","auto":false,"stage":211,"band":"sensors","label":"sensors 211","seq":56,"warnings":[],"heading":"Step 57 (sensors 211): Sensors 2: SW_RAIL_LOW on the aim housing"},{"title":"Sensors 3: SW_GAP on the right rail cheek","text":"Build SW_GAP as in Sensors 1 (its base has its own arm). Hold the arm tab on the outer face of the right rail cheek, below the big gear, and screw it on with 2 x M3x12 (heads in the counterbores). With the big gear at rest (toothless gap at the rack) the cam bump presses the lever: switch closed. Turn the gear 20 deg either way: switch open.","parts":["sensors_sw_gap","sensors_sw_gap_lever","sensors_sw_gap_screw","sensors_sw_gap_jam","sensors_sw_gap_nut"],"handle":[],"subsystem":"sensors","auto":false,"stage":212,"band":"sensors","label":"sensors 212","seq":57,"warnings":[],"heading":"Step 58 (sensors 212): Sensors 3: SW_GAP on the right rail cheek"},{"title":"Sensors 4: AS5600 board","text":"Do this after the magnet cap is on the main shaft end (drum steps): the board sits 2 mm in front of it. Battery unplugged. Plug the STEMMA QT cable into the board's connector on the +x end (the end away from the housing spine). Push the board onto the 4 pegs of the carrier, chip facing out. Drop an M3 nut into each hex pocket in the carrier back, lay the strips over the board edges (pegs through their holes) and screw each from the strip front with an M3x12 into its nut. Screw the carrier column to the aim housing spine with 2 x M3x16. Check by eye: the chip sits on the shaft axis, about 2.0 mm from the magnet face, and the cap turns free.","parts":["sensors_as5600","sensors_as5600_carrier","sensors_as5600_strip_top","sensors_as5600_strip_bot","sensors_as5600_nut_top","sensors_as5600_nut_bot","sensors_as5600_screw_top","sensors_as5600_screw_bot","sensors_as5600_col_screws"],"handle":[],"subsystem":"sensors","auto":false,"stage":213,"band":"sensors","label":"sensors 213","seq":58,"warnings":[],"heading":"Step 59 (sensors 213): Sensors 4: AS5600 board"},{"title":"Electronics bay","text":"Battery unplugged. Bay on the deck, 4 x M3 x 10 through the tabs. Boards in: BTS7960 on its 4 standoffs (M3 x 6), heatsink down; ESP32 DevKitC pins down into the cradle, USB end into the wall slot, clamp with 2 x M3 x 8; DRV8833, MP1584 and HX711 into their pockets with a cable tie through the floor slots or a drop of hot glue. Fuse holder in its cradle with a cable tie.","parts":["frame_ebay_lid","frame_ebay_esp_clamp","frame_pcb_esp32","frame_pcb_bts7960","frame_pcb_mp1584","frame_pcb_drv8833","frame_pcb_hx711","frame_fuse_20a"],"handle":["frame_ebay"],"subsystem":"frame","auto":false,"stage":220,"band":"electronics","label":"electronics 220","seq":59,"warnings":[],"heading":"Step 60 (electronics 220): Electronics bay"},{"title":"Set the buck BEFORE wiring the DRV8833","text":"Battery unplugged. Wire only the buck input to the fuse output and ground. Plug the battery in, meter on the buck output, turn the trimpot until it reads 9.0 V. Unplug the battery. Only then wire buck output to DRV8833 VIN (the DRV8833 dies above 10.8 V).","parts":[],"handle":["frame_pcb_mp1584","frame_pcb_drv8833"],"subsystem":"frame","auto":false,"stage":221,"band":"electronics","label":"electronics 221","seq":60,"warnings":[],"heading":"Step 61 (electronics 221): Set the buck BEFORE wiring the DRV8833"},{"title":"Camera, receiver and cable anchors","text":"Camera column on the deck, 4 x M3 x 10 into the inserts. Clip the Kiyo X onto the 16 mm edge plate like onto a monitor (or use a 1/4-20 tripod screw up through the plate hole); it looks forward along the launch line. RC832: stand it antenna-end up in its holder slot, leads out of the low notch, holder 2 x M3 x 10. Cable anchors 1 x M3 x 12 each; tie the camera USB, the receiver AV lead and the capture dongle lead to them so no plug carries the cable weight.","parts":["frame_camera_mount","frame_rc832_holder","frame_rc832","frame_kiyo_x","frame_cable_anchor_1","frame_cable_anchor_2"],"handle":[],"subsystem":"frame","auto":false,"stage":222,"band":"electronics","label":"electronics 222","seq":61,"warnings":[],"heading":"Step 62 (electronics 222): Camera, receiver and cable anchors"},{"title":"Wiring and lid","text":"Battery unplugged. Follow firmware/base/WIRING.md. Every wire leaving the bay goes through its wall exit and is cable-tied to the anchor beside it (strain relief). 14 AWG for battery, fuse, BTS7960 and motor. Lid on, 4 x M3 x 6. USB cable from the ESP32 native USB port to the Jetson.","parts":[],"handle":["frame_ebay_lid"],"subsystem":"frame","auto":false,"stage":223,"band":"electronics","label":"electronics 223","seq":62,"warnings":[],"heading":"Step 63 (electronics 223): Wiring and lid"},{"title":"Gear guards","text":"After every train has been turned by hand: the hood goes over the gears in front of the motor plate, M3 x 10 through each lug into the plate inserts; the front guard stands on the deck between the drum gears and the bay, M3 x 10 into the deck inserts. Turn the wiper by hand once: nothing rubs.","parts":["frame_guard_hood","frame_guard_front"],"handle":[],"subsystem":"frame","auto":false,"stage":230,"band":"guards","label":"guards 230","seq":63,"warnings":[],"heading":"Step 64 (guards 230): Gear guards"},{"title":"Test stage 5 only: springs (NOT during assembly)","text":"The springs go on at test stage 5, after the big gear timing, the contacts and the aim train have been checked without them. Spring guards on first (never cock with a guard off) and never fire without the tether attached (D11). Hook the back end of each spring over the inner peg of the yoke arm. Put the front hook between post and strap, lined up with the main hole, and push the 8 mm steel rod pin down through strap, hook and post. Hole set F, 8.5 mm rearward, is the fallback if the hang test shows the spring needs less stretch. The outer holes are spare. The springs are slightly stretched and hold the carriage against the stop. A drop of glue on the pin top stops it working up.","parts":["launch_anchor_pin_l","launch_anchor_pin_r","launch_spring_l_hook_a","launch_spring_r_hook_a","launch_spring_l_hook_c","launch_spring_r_hook_c","launch_spring_l_0","launch_spring_l_1","launch_spring_l_2","launch_spring_l_3","launch_spring_l_4","launch_spring_r_0","launch_spring_r_1","launch_spring_r_2","launch_spring_r_3","launch_spring_r_4"],"handle":[],"subsystem":"launch","auto":false,"stage":999,"band":"test_stage_only","label":"test_stage_only 999","seq":64,"warnings":[],"heading":"Step 65 (test_stage_only 999): Test stage 5 only: springs (NOT during assembly)"}],"ext_files":["web/assembly_ext_0.json","web/assembly_ext_1.json"]};

<script>
// base/tools/web/viewer_core.js: generic three.js scene builder for the CAD pipeline.
// Input: window.CAD_DATA (built by tools/render.py build_data):
//   parts:  [{name, color, material, notes, subsystem, joint, bought_ref, printed, qty, mass_g, group, place[16]}]
//   meshes: {name: {q: [ox, oy, oz, s], v: b64 int16 xyz, f: b64 uint16 or uint32, h: hull vertex indices, wide: bool}}
//   tracks: {n, t[], joints: [{name, parent, kind, origin[3], axis[3], base[16] | null, v: b64 values * n | c}],
//            line: {cnt: b64 uint16 * n, p: b64 float32 xyz} (tether polyline per sample, optional)}
//   box_track: world bbox over all samples
// Group 0 is the world; group k is joint k - 1: world = parent * T(origin) * base * motion(value), the value
// (rev: degrees, slide: mm) interpolated linearly between samples. Part world matrix = group * place (row-major).
// CADV.build(container, data, opts) returns a viewer with sample(), cut(), explode(), cam(), highlight(), shot API.
(function () {
  'use strict';
  const V3 = THREE.Vector3, M4 = THREE.Matrix4, Q = THREE.Quaternion;
  const D2R = Math.PI / 180;

  function b64(s, T) {
    const bin = atob(s), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new T(u.buffer);
  }
  function rowMajor(a) { const m = new M4(); m.set(...a); return m; }

  // Indexed mesh -> non-indexed geometry with creased normals (smooth below the crease angle, sharp above).
  function creased(pos, idx, creaseDeg) {
    const nf = idx.length / 3, nv = pos.length / 3, cosT = Math.cos((creaseDeg || 32) * D2R);
    const fn = new Float32Array(nf * 3), fa = new Float32Array(nf);
    for (let f = 0; f < nf; f++) {
      const a = idx[3 * f] * 3, b = idx[3 * f + 1] * 3, c = idx[3 * f + 2] * 3;
      const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
      const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1; fa[f] = l;
      fn[3 * f] = nx / l; fn[3 * f + 1] = ny / l; fn[3 * f + 2] = nz / l;
    }
    const cnt = new Uint32Array(nv + 1);
    for (let i = 0; i < idx.length; i++) cnt[idx[i] + 1]++;
    for (let i = 0; i < nv; i++) cnt[i + 1] += cnt[i];
    const adj = new Uint32Array(idx.length), fill = cnt.slice(0, nv);
    for (let i = 0; i < idx.length; i++) adj[fill[idx[i]]++] = (i / 3) | 0;
    const P = new Float32Array(nf * 9), N = new Float32Array(nf * 9);
    for (let f = 0; f < nf; f++) {
      const fx = fn[3 * f], fy = fn[3 * f + 1], fz = fn[3 * f + 2];
      for (let k = 0; k < 3; k++) {
        const v = idx[3 * f + k], o = 9 * f + 3 * k;
        P[o] = pos[3 * v]; P[o + 1] = pos[3 * v + 1]; P[o + 2] = pos[3 * v + 2];
        let sx = 0, sy = 0, sz = 0;
        for (let j = cnt[v]; j < cnt[v + 1]; j++) {
          const g = adj[j], gx = fn[3 * g], gy = fn[3 * g + 1], gz = fn[3 * g + 2];
          if (gx * fx + gy * fy + gz * fz >= cosT) { const w = fa[g]; sx += gx * w; sy += gy * w; sz += gz * w; }
        }
        const l = Math.hypot(sx, sy, sz) || 1;
        N[o] = sx / l; N[o + 1] = sy / l; N[o + 2] = sz / l;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(P, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
    return g;
  }

  function decodeMesh(md) {
    const q = b64(md.v, Int16Array), s = md.q[3], pos = new Float32Array(q.length);
    for (let i = 0; i < q.length; i += 3) { pos[i] = md.q[0] + q[i] * s; pos[i + 1] = md.q[1] + q[i + 1] * s; pos[i + 2] = md.q[2] + q[i + 2] * s; }
    const IT = md.wide ? Uint32Array : Uint16Array, idx = b64(md.f, IT);
    let hull = pos;
    if (typeof md.h === 'string') {
      const h = b64(md.h, IT); hull = new Float32Array(3 * h.length);
      for (let i = 0; i < h.length; i++) { hull[3 * i] = pos[3 * h[i]]; hull[3 * i + 1] = pos[3 * h[i] + 1]; hull[3 * i + 2] = pos[3 * h[i] + 2]; }
    }
    return { geo: creased(pos, idx, 32), hull };
  }

  // Joint-space tracks: joints [{parent, kind, origin, axis, base, v (b64 float32/64 per sample) | c (constant)}],
  // parents before children. group 0 = world, group k = joint k - 1.
  function decodeTracks(T) {
    return (T.joints || []).map(j => {
      const pre = new M4().makeTranslation(j.origin[0], j.origin[1], j.origin[2]);
      if (j.base) pre.multiply(rowMajor(j.base));
      const vals = typeof j.v === 'string' ? b64(j.v, j.f64 ? Float64Array : Float32Array) : null;
      return { name: j.name, parent: j.parent, kind: j.kind, axis: new V3(j.axis[0], j.axis[1], j.axis[2]), pre, vals, c: +j.c || 0, world: new M4() };
    });
  }
  function jointValue(J, s) {
    const a = J.vals; if (!a) return J.c;
    const n = a.length; if (n === 1) return a[0];
    s = Math.max(0, Math.min(n - 1, s));
    const i = Math.min(n - 2, Math.floor(s)), f = s - i;
    return a[i] + (a[i + 1] - a[i]) * f;
  }
  // Tether polyline per sample: {cnt: b64 uint16 per sample, p: b64 float32 xyz of all points in sample order}
  function decodeLine(L) {
    if (!L || typeof L.p !== 'string') return null;
    const cnt = b64(L.cnt, Uint16Array), p = b64(L.p, Float32Array), off = new Uint32Array(cnt.length + 1);
    for (let i = 0; i < cnt.length; i++) off[i + 1] = off[i] + cnt[i];
    let mx = 0; for (let i = 0; i < cnt.length; i++) mx = Math.max(mx, cnt[i]);
    return { cnt, p, off, max: mx };
  }

  // cut faces: back faces drawn flat with a screen-space hatch, so a sectioned solid reads as filled
  function capMaterial(color, planes) {
    const c = new THREE.Color(color).convertSRGBToLinear();
    const hsl = c.getHSL({}); if (hsl.l < 0.22) c.setHSL(hsl.h, hsl.s, 0.22);     // dark parts: keep the hatch readable
    const m = new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide, clippingPlanes: planes,
      polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -4 });
    m.onBeforeCompile = sh => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>',
        '#include <dithering_fragment>\n float hz = mod(gl_FragCoord.x + gl_FragCoord.y, 9.0);\n' +
        ' gl_FragColor.rgb = mix(gl_FragColor.rgb * 0.62, vec3(0.08), hz < 1.6 ? 0.55 : 0.0);');
    };
    return m;
  }

  // theme colours for the scene (the page background comes from the CSS tokens)
  function sceneTheme(dark) {
    return dark ? { hemiGround: 0x30343a, hemi: 0.55, grid1: 0x3a4048, grid2: 0x2a2f36, gridOp: 0.45, shadow: 0.45, key: 0.8 }
      : { hemiGround: 0x8a94a0, hemi: 0.7, grid1: 0xc3c8cf, grid2: 0xdde1e6, gridOp: 0.8, shadow: 0.22, key: 0.85 };
  }

  function build(container, data, opts) {
    opts = opts || {};
    const hd = !!opts.hd, shot = !!window.CAD_SHOT;       // CAD_SHOT: headless capture (shots.js), cheaper settings
    const dpr = window.devicePixelRatio || 1;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(shot ? Math.min(2, dpr) : Math.min(2, dpr) * (hd && dpr < 2 ? 1.5 : 1));   // shots: no hd boost (ratio 1 unless the job sets a device scale)
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = opts.shadows !== false;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const bg = new THREE.Color(opts.bg || '#eef1f4'); scene.background = bg;
    let dark = opts.dark != null ? !!opts.dark : bg.getHSL({}).l < 0.5;
    let TH = sceneTheme(dark);
    const cam = new THREE.PerspectiveCamera(30, container.clientWidth / Math.max(1, container.clientHeight), 0.5, 1e6);
    cam.up.set(0, 0, 1);
    const ctl = THREE.OrbitControls ? new THREE.OrbitControls(cam, renderer.domElement) : null;
    if (ctl) { ctl.enableDamping = false; ctl.screenSpacePanning = true; }

    // lights
    const hemi = new THREE.HemisphereLight(0xffffff, TH.hemiGround, TH.hemi); scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, TH.key); key.castShadow = true;
    const sm = shot ? 1024 : hd ? 4096 : 2048;
    key.shadow.mapSize.set(sm, sm); key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
    scene.add(key); scene.add(key.target);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35); scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.2); scene.add(rim);

    // clipping plane: keeps coord <= value along the chosen axis
    const clip = new THREE.Plane(new V3(-1, 0, 0), 1e9), planes = [clip];

    // parts
    const joints = decodeTracks(data.tracks), nS = data.tracks.n;
    const I4 = new M4();
    const groupWorld = g => (g > 0 && joints[g - 1]) ? joints[g - 1].world : I4;
    const parts = {}, list = [];
    for (const p of data.parts) {
      const md = data.meshes[p.name]; if (!md) continue;
      const dm = decodeMesh(md), geo = dm.geo;
      const metal = p.material === 'steel' || (p.material === 'bought' && /brg|bearing|608|steel|shaft|screw|bolt|nut|pin/i.test(p.name + ' ' + (p.bought_ref || '')));
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(p.color || '#c8ccd2').convertSRGBToLinear(), roughness: metal ? 0.38 : 0.6,
        metalness: metal ? 0.55 : 0.04, clippingPlanes: planes, clipShadows: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = mesh.receiveShadow = true; mesh.matrixAutoUpdate = false;
      const capMat = capMaterial(p.color || '#c8ccd2', planes);
      const cap = new THREE.Mesh(geo, capMat);
      cap.matrixAutoUpdate = false; cap.visible = false; cap.renderOrder = 1;
      scene.add(mesh); scene.add(cap);
      geo.computeBoundingBox();
      const rec = { p, mesh, cap, mat, capMat, hull: dm.hull, place: rowMajor(p.place), group: p.group || 0, world: new M4(), off: new V3(), dir: new V3(), hidden: false };
      mesh.userData.rec = rec; parts[p.name] = rec; list.push(rec);
    }

    // tether line: unit cylinders (along y) instanced per segment, radius >= ~1.3 px on screen
    const LN = decodeLine(data.tracks.line);
    let line = null;
    if (LN && LN.max > 1) {
      const lg = new THREE.CylinderGeometry(1, 1, 1, 8, 1, false);
      const lm = new THREE.MeshStandardMaterial({ color: new THREE.Color('#ff9a1f').convertSRGBToLinear(), roughness: 0.5, metalness: 0,
        emissive: new THREE.Color('#ff9a1f').convertSRGBToLinear(), emissiveIntensity: 0.25 });
      line = new THREE.InstancedMesh(lg, lm, LN.max - 1); line.count = 0; line.frustumCulled = false; line.castShadow = true;
      line.renderOrder = 2; scene.add(line);
    }
    const linePts = [];
    function lineAt(s) {
      linePts.length = 0; if (!LN) return linePts;
      const n = LN.cnt.length; s = Math.max(0, Math.min(n - 1, s));
      const i = Math.min(Math.max(0, n - 2), Math.floor(s)), f = n > 1 ? s - i : 0, j = Math.min(n - 1, i + 1);
      const ci = LN.cnt[i], cj = LN.cnt[j], P = LN.p;
      if (ci === cj && j !== i) {
        const a = 3 * LN.off[i], b = 3 * LN.off[j];
        for (let k = 0; k < 3 * ci; k += 3) linePts.push(P[a + k] + (P[b + k] - P[a + k]) * f, P[a + k + 1] + (P[b + k + 1] - P[a + k + 1]) * f, P[a + k + 2] + (P[b + k + 2] - P[a + k + 2]) * f);
      } else {
        const m = f < 0.5 ? i : j, a = 3 * LN.off[m];
        for (let k = 0; k < 3 * LN.cnt[m]; k++) linePts.push(P[a + k]);
      }
      return linePts;
    }
    const lq = new Q(), lv = new V3(), lu = new V3(0, 1, 0), ls = new V3(), lmtx = new M4(), lmid = new V3();
    function updateLine() {
      if (!line) return;
      const pts = linePts, ns = pts.length / 3 - 1;
      const pxk = 2 * Math.tan(cam.fov * D2R / 2) / Math.max(1, renderer.domElement.clientHeight || container.clientHeight);
      let k = 0;
      for (let i = 0; i < ns; i++) {
        lv.set(pts[3 * i + 3] - pts[3 * i], pts[3 * i + 4] - pts[3 * i + 1], pts[3 * i + 5] - pts[3 * i + 2]);
        const len = lv.length(); if (len < 1e-6) continue;
        lmid.set(pts[3 * i] + lv.x / 2, pts[3 * i + 1] + lv.y / 2, pts[3 * i + 2] + lv.z / 2);
        const rad = Math.max(0.5, 1.3 * pxk * lmid.distanceTo(cam.position));      // 1 mm Dyneema, never thinner than ~2.6 px
        lq.setFromUnitVectors(lu, lv.multiplyScalar(1 / len)); ls.set(rad, len + rad, rad);
        line.setMatrixAt(k++, lmtx.compose(lmid, lq, ls));
      }
      line.count = k; line.instanceMatrix.needsUpdate = true;
    }

    // poses
    let curS = 0, expl = 0, needs = true, frozen = false;
    const mark = () => { needs = true; };
    const mot = new M4(), tm = new M4();
    function poseJoints(s) {
      for (const J of joints) {
        const v = jointValue(J, s);
        if (J.kind === 'rev') mot.makeRotationAxis(J.axis, v * D2R);
        else if (J.kind === 'slide') mot.makeTranslation(J.axis.x * v, J.axis.y * v, J.axis.z * v);
        else mot.identity();
        J.world.copy(J.parent >= 0 ? joints[J.parent].world : I4).multiply(J.pre).multiply(mot);
      }
    }
    function apply() {
      needs = true;
      poseJoints(curS);
      for (const r of list) {
        r.world.multiplyMatrices(groupWorld(r.group), r.place);
        r.mesh.matrix.copy(r.world);
        if (expl) { r.mesh.matrix.premultiply(tm.makeTranslation(r.dir.x * expl, r.dir.y * expl, r.dir.z * expl)); }
        if (r.off.lengthSq()) r.mesh.matrix.premultiply(tm.makeTranslation(r.off.x, r.off.y, r.off.z));
        r.cap.matrix.copy(r.mesh.matrix);
        r.mesh.matrixWorld.copy(r.mesh.matrix); r.cap.matrixWorld.copy(r.mesh.matrix);
      }

    }
    function sample(s) { curS = +s; apply(); }

    // bounding box of the visible (or named) parts in the current pose: exact, from the transformed hull vertices
    function bbox(names) {
      const b = new THREE.Box3(), set = names ? new Set(names) : null;
      let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;
      for (const r of list) {
        if (set ? !set.has(r.p.name) : !r.mesh.visible) continue;
        const e = r.mesh.matrix.elements, h = r.hull;
        for (let i = 0; i < h.length; i += 3) {
          const x = h[i], y = h[i + 1], z = h[i + 2];
          const X = e[0] * x + e[4] * y + e[8] * z + e[12], Y = e[1] * x + e[5] * y + e[9] * z + e[13], Z = e[2] * x + e[6] * y + e[10] * z + e[14];
          if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y; if (Z < z0) z0 = Z; if (Z > z1) z1 = Z;
        }
      }
      if (x0 > x1) b.set(new V3(-50, -50, 0), new V3(50, 50, 50)); else b.set(new V3(x0, y0, z0), new V3(x1, y1, z1));
      return b;
    }
    sample(0);
    const box0 = bbox(), c0 = box0.getCenter(new V3()), size0 = box0.getSize(new V3()), R0 = Math.max(10, size0.length() / 2);
    for (const r of list) {
      const c = r.mesh.geometry.boundingBox.getCenter(new V3()).applyMatrix4(r.world);
      r.dir.copy(c).sub(c0);
    }
    // whole track bbox (all samples, computed by tools/render.py) for the ground, grid, cut range and mission view
    const boxT = data.box_track ? new THREE.Box3(new V3(...data.box_track[0]), new V3(...data.box_track[1])).union(box0) : box0.clone();
    if (LN) for (let i = 0; i < LN.p.length; i += 3) boxT.expandByPoint(new V3(LN.p[i], LN.p[i + 1], LN.p[i + 2]));
    const cT = boxT.getCenter(new V3()), RT = Math.max(R0, boxT.getSize(new V3()).length() / 2);

    // ground at the lowest point of the whole track (origin is on the main shaft axis, the deck is below z = 0)
    // unless the data sets it; ground and grid cover the track bbox plus a margin
    const gz = (typeof data.ground_z === 'number' ? Math.min(data.ground_z, boxT.min.z) : boxT.min.z) - Math.max(0.5, R0 * 0.004);
    const gsize = Math.max(R0 * 40, RT * 6);
    const groundMat = new THREE.ShadowMaterial({ opacity: TH.shadow });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(gsize, gsize), groundMat);
    ground.position.set(cT.x, cT.y, gz); ground.receiveShadow = true; scene.add(ground);
    let grid = null, groundOn = true;
    function makeGrid() {
      if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
      const ext = Math.max(R0 * 6, RT * 2.4);
      let step = Math.pow(10, Math.floor(Math.log10(R0 / 2)));
      while (ext / step > 400) step *= 10;                 // keep the line count sane for metre-scale tracks

      grid.material.transparent = true; grid.material.opacity = TH.gridOp; grid.material.depthWrite = false;

    }
    makeGrid();
    function lights() {
      const R = R0;                     // shadows sized to the machine (sharp), not to the whole flight path
      key.position.set(c0.x + R * 1.2, c0.y - R * 1.6, c0.z + R * 3.0); key.target.position.copy(c0);
      const sc = key.shadow.camera; sc.left = sc.bottom = -R * 1.6; sc.right = sc.top = R * 1.6; sc.near = R * 0.1; sc.far = R * 8; sc.updateProjectionMatrix();
      fill.position.set(c0.x - R * 2, c0.y + R * 1.5, c0.z + R * 0.8);

    lights();
    function setTheme(isDark, bgColor) {
      dark = !!isDark; TH = sceneTheme(dark);
      if (bgColor) scene.background = new THREE.Color(bgColor);
      hemi.groundColor.set(TH.hemiGround); hemi.intensity = TH.hemi; key.intensity = TH.key;

    let cutState = null;
    // camera helpers: target, distance, azimuth (deg from +x toward +y), elevation (deg)

    function camSet(t, r, az, el) {

    function fitDist(box, margin) {

    if (ctl) ctl.addEventListener('change', () => {
      needs = true;
      const d = cam.position.clone().sub(ctl.target); orb.t.copy(ctl.target); orb.r = d.length();
      orb.el = Math.asin(Math.max(-1, Math.min(1, d.z / orb.r))) / D2R; orb.az = Math.atan2(d.y, d.x) / D2R;

    // section cut
    function cut(axis, value, flip) {

        cutState = null; clip.normal.set(-1, 0, 0); clip.constant = 1e9;
        for (const r of list) r.cap.visible = false;

      cutState = { axis, value, flip: !!flip };

    }
    function explode(f) { expl = +f || 0; apply(); }
    let hlLevel = null;
    function highlightLevel(x) { hlLevel = x; for (const r of list) if (r.mat.emissiveIntensity > 0) r.mat.emissiveIntensity = x; needs = true; }
    function ghostMat(m, gh) {
      if (m.transparent === gh) return;
      m.transparent = gh; m.opacity = gh ? 0.25 : 1; m.depthWrite = !gh; m.needsUpdate = true;
    }
    function highlight(names, ghost) {
      needs = true;

        const on = set.has(r.p.name);

      let moving = false; for (let i = k + 1; i > 0 && !moving; i = joints[i - 1].parent + 1) moving = !!joints[i - 1].vals;

    const api = {
      renderer, scene, cam, ctl, parts, list, data, nSamples: nS, dark, box0, center: c0, radius: R0, boxTrack: boxT, joints, movers,
      sample, cut, explode, highlight, highlightLevel, show, setOffset, setGround, setTheme, pick, bbox, view, fitDist, render, renderIfNeeded, resize, mark, freeze,

  // window.AUD-like API for headless shots

      view: (az, el, margin) => { v.view(az, el, margin); v.render(); },
      cut: (axis, value, flip) => { v.cut(axis, value, flip); v.render(); },
      sample: i => { v.sample(i); v.render(); },

      explode: f => { v.explode(f); v.render(); },
      ground: on => { v.setGround(on); v.render(); },
      show: names => { v.show(names); v.render(); },

  // Start an app once the data is complete: CAD_DATA.ext_files (relative URLs of JSON files {id.piece: string})
  // are fetched first, and every {ext: id, n: pieces} placeholder in CAD_DATA.meshes and CAD_DATA.tracks is replaced

    d.textContent = 'Could not load the model: ' + (e && e.message || e); document.body.appendChild(d);

})();

<script>
// base/tools/web/assembly_app.js: generic assembly steps page. CAD_DATA.steps = [{title, text, parts, subsystem, auto}]
// built by tools/steps.py. Each step shows the parts added so far; the new parts fly in from an exploded offset.
CADV.boot(function () {
  'use strict';
  const D = window.CAD_DATA, $ = s => document.querySelector(s);
  const css = () => getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#eef1f4';
  const isDark = () => { const a = document.documentElement.dataset.theme; return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
  const V = CADV.build($('#view'), D, { hd: true, bg: css(), dark: isDark() });
  CADV.installAUD(V);
  // text steps (no new parts) stay: they show the current state
  const STEPS = D.steps.map(s => Object.assign({}, s, { parts: s.parts.filter(n => V.parts[n]) }));
  const NP = V.list.length;
  $('#ttl').textContent = D.title + ' assembly';
  $('#card').onclick = () => $('#card').classList.toggle('more');
  V.sample(0);
  V.setGround(true);

  // fly-in offsets: up and away from what is already built
  const centre = n => V.parts[n].mesh.geometry.boundingBox.getCenter(new THREE.Vector3()).applyMatrix4(V.parts[n].world);
  const R = V.radius;
  STEPS.forEach((st, i) => {
    const before = STEPS.slice(0, i).flatMap(s => s.parts);
    const c0 = new THREE.Vector3();
    if (before.length) { before.forEach(n => c0.add(centre(n))); c0.multiplyScalar(1 / before.length); } else c0.copy(V.center);
    st.off = {};
    for (const n of st.parts) {
      const d = centre(n).sub(c0); d.z = 0;
      const h = d.length() > 1e-6 ? d.normalize().multiplyScalar(0.35 * R) : new THREE.Vector3();
      st.off[n] = [h.x, h.y, (before.length ? 0.9 : 0.6) * R];
    }
  });

  const list = $('#steps');
  STEPS.forEach((st, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + (st.label ? ' (' + st.label + ')' : '') + '. ' + st.title; b.title = st.text || ''; b.onclick = () => go(i); list.appendChild(b); });
  let cur = 0, t0 = performance.now(), userCam = false, anim = true, fixedF = null;
  const info = n => V.parts[n].p;
  function bill(st) {
    return st.parts.map(n => {
      const p = info(n);
      const ref = [p.bought_ref, p.notes].filter(Boolean).join('. ');
      return `<tr class="new"><td><span class="sw" style="background:${p.color}"></span>${n}${ref ? '<div class="d">' + ref + '</div>' : ''}</td>` +
        `<td>${p.qty || 1}</td><td>${p.material}${p.mass_g != null ? '<div class="d">' + p.mass_g + ' g</div>' : ''}</td></tr>`;
    }).join('');
  }
  function go(i, instant) {
    fixedF = null; V.freeze(false);
    cur = Math.max(0, Math.min(STEPS.length - 1, i)); t0 = performance.now() - (instant ? 1e5 : 0); anim = true;
    const st = STEPS[cur], sofar = STEPS.slice(0, cur + 1).reduce((a, s) => a + s.parts.length, 0);
    $('#st').textContent = `Step ${cur + 1}${st.label ? ' (' + st.label + ')' : ''}: ${st.title}`;
    $('#sd').textContent = st.text || '';
    $('#count').textContent = `Step ${cur + 1} of ${STEPS.length}. ${st.parts.length} new part${st.parts.length === 1 ? '' : 's'} (highlighted), ${sofar} of ${NP} fitted` + (st.subsystem ? `, ${st.subsystem}` : '');
    $('#bill').innerHTML = bill(st);
    [...list.children].forEach((b, j) => { b.classList.toggle('on', j === cur); b.classList.toggle('done', j < cur); });
    $('#prev').disabled = cur === 0; $('#next').disabled = cur === STEPS.length - 1;
    const shown = STEPS.slice(0, cur + 1).flatMap(s => s.parts);
    V.show(shown); userCam = false;
    const ghost = $('#ghost').checked;
    V.highlight(st.parts, ghost);
  }
  $('#prev').onclick = () => go(cur - 1); $('#next').onclick = () => go(cur + 1);
  $('#replay').onclick = () => go(cur); $('#recam').onclick = () => { userCam = false; anim = true; };
  $('#ghost').onchange = () => go(cur, true);
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
  if (V.ctl) V.ctl.addEventListener('start', () => { userCam = true; });

  // tooltip
  const tip = $('#tip'), cv = V.renderer.domElement;
  cv.addEventListener('pointermove', e => {
    if (e.buttons) { tip.style.display = 'none'; return; }
    const r = V.pick(e.clientX, e.clientY); if (!r) { tip.style.display = 'none'; return; }
    const p = r.p;
    tip.innerHTML = `<b>${p.name}</b><br>${p.material}${p.bought_ref ? ', ' + p.bought_ref : ''}${p.notes ? '<br>' + p.notes : ''}`;
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;          // keep the tooltip inside the window
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - 14 - w;
    if (y + h > innerHeight - 8) y = e.clientY - 14 - h;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x)) + 'px'; tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, y)) + 'px';
  });

  // theme: auto (follows the system), light, dark
  const themes = ['auto', 'light', 'dark']; let th = 0;
  function applyTheme() { V.setTheme(isDark(), css()); V.render(); }
  $('#theme').onclick = () => {
    th = (th + 1) % 3; if (th === 0) document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = themes[th];
    $('#theme').textContent = 'theme: ' + themes[th]; applyTheme();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

  // camera follows the parts fitted so far
  const camT = V.center.clone(); let camR = V.fitDist(V.box0, 0.9);
  function step(now) {
    const f = fixedF != null ? fixedF : Math.min(1, (now - t0) / 1300), e = 1 - Math.pow(1 - f, 3);
    if (anim) {
      const st = STEPS[cur];
      V.highlightLevel(0.12 + 0.4 * (1 - e));
      for (const r of V.list) r.off.set(0, 0, 0);
      for (const n of st.parts) { const o = st.off[n]; V.setOffset(n, [o[0] * (1 - e), o[1] * (1 - e), o[2] * (1 - e)]); }
      V.sample(0);
      if (!userCam) {
        const shown = STEPS.slice(0, cur + 1).flatMap(s => s.parts);
        for (const r of V.list) r.off.set(0, 0, 0);
        V.sample(0);
        const box = V.bbox(shown);
        for (const n of st.parts) { const o = st.off[n]; V.setOffset(n, [o[0] * (1 - e), o[1] * (1 - e), o[2] * (1 - e)]); }
        V.sample(0);
        const gt = box.getCenter(new THREE.Vector3()), gr = Math.max(V.radius * 0.8, V.fitDist(box, 1.0));
        const k = f >= 1 || fixedF != null ? 1 : 0.12;
        camT.lerp(gt, k); camR += (gr - camR) * k;
        const c = V.camGet(); V.cam(camT.toArray(), camR, c.az, c.el);
        if (f >= 1 && camT.distanceTo(gt) < 1e-3) anim = false;
      } else if (f >= 1) anim = false;
    }

    if (!V.frozen()) step(now);
    V.renderIfNeeded(); requestAnimationFrame(frame);
  }
  // shots: pose the current step at a fixed animation fraction f (0 = start of the fly-in, 1 = settled, camera
  // snapped), render once and stop redrawing until the next go()
  function freezeAt(f) {
    fixedF = Math.max(0, Math.min(1, +f)); anim = true; userCam = false;
    step(performance.now()); V.render(); V.freeze(true);
  }
  V.view(-50, 30, 0.9); camR = V.camGet().r;
  go(0);
  window.ASM_GO = (i, instant) => { go(+i, !!instant); };
  window.ASM_FREEZE = freezeAt;
  window.ASM = { go: window.ASM_GO, freeze: freezeAt, steps: STEPS, viewer: V };
  requestAnimationFrame(frame);
  window.READY = true;
});
